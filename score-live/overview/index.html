<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教育訓練整合總覽｜首測 · 複測 · 每日測驗</title>
<style>
  :root{--bg:#f4f6f9;--card:#fff;--ink:#1a2330;--muted:#66738a;--line:#e3e8ef;
    --brand:#0b6b3a;--brand2:#12945a;--accent:#1565c0;--warn:#c62828;--warnbg:#fdecea;
    --okbg:#e8f5ec;--chip:#eef2f7;--shadow:0 1px 3px rgba(20,40,70,.08),0 6px 18px rgba(20,40,70,.05)}
  @media (prefers-color-scheme:dark){:root{--bg:#0f141b;--card:#161d27;--ink:#e6ebf2;--muted:#93a1b5;
    --line:#26313f;--brand:#38c07f;--brand2:#2ea36a;--accent:#5aa2e6;--warn:#ff6b6b;--warnbg:#3a1f22;
    --okbg:#183026;--chip:#1e2733;--shadow:0 1px 3px rgba(0,0,0,.4)}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.55}
  .wrap{max-width:1300px;margin:0 auto;padding:16px 16px 60px}
  h1{font-size:20px;margin:0 0 2px;font-weight:800}
  .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .tabs button{border:0;background:var(--chip);color:var(--muted);padding:9px 16px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer}
  .tabs button.on{background:var(--brand);color:#fff}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .tile .k{font-size:12px;color:var(--muted);font-weight:600}
  .tile .v{font-size:24px;font-weight:800;margin-top:2px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  input{background:var(--bg);border:1.5px solid var(--line);color:var(--ink);border-radius:9px;padding:9px 11px;font-size:14px}
  button.act{border:0;background:var(--brand);color:#fff;border-radius:9px;padding:9px 15px;font-size:14px;font-weight:700;cursor:pointer}
  button.sec{background:var(--chip);color:var(--ink)}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{border-bottom:1px solid var(--line);padding:8px 9px;text-align:left;white-space:nowrap}
  th{background:var(--chip);position:sticky;top:0;cursor:pointer}
  .tblwrap{overflow-x:auto;max-height:72vh}
  .pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
  .pass{background:var(--okbg);color:var(--brand)} .fail{background:var(--warnbg);color:var(--warn)}
  .muted{color:var(--muted)} .warn{color:var(--warn)} .ok{color:var(--brand)}
  .dot{color:var(--muted)}
  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🧭 教育訓練整合總覽</h1>
  <div class="sub">以工號串起 首測成績 · 常錯題複測 · 每日安全測驗　三系統｜資料即時來自 Supabase（頁面零金鑰零姓名）</div>
  <div class="tabs">
    <button data-t="cross" class="on">👤 個人總覽</button>
    <button data-t="daily">🦺 今日每日測驗</button>
    <button data-t="retest">🔁 常錯題複測</button>
  </div>
  <div id="view"><div class="card">載入中…</div></div>
  <div class="foot">新竹物流轉運中心 · 教育訓練整合追蹤</div>
</div>

<script>
const API = "https://hmqnlovyzlvvnkqmfwtt.supabase.co/functions/v1/overview";
const K = new URLSearchParams(location.search).get("k") || "";
const view = document.getElementById("view");
const esc = s => (s ?? "").replace(/[&<>]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c]));
let DATA = null, sortKey = "dq_days", sortDir = -1;

async function load(){
  const res = await fetch(`${API}?k=${encodeURIComponent(K)}`);
  return res.json();
}
document.querySelectorAll(".tabs button").forEach(b=>{
  b.onclick=()=>{ document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on")); b.classList.add("on"); TAB[b.dataset.t](); };
});
const TAB = { cross:renderCross, daily:renderDaily, retest:renderRetest };

function tiles(){
  const s = DATA.sum;
  return `<div class="tiles">
    <div class="tile"><div class="k">總人數(去重)</div><div class="v">${s.people}</div></div>
    <div class="tile"><div class="k">首測有紀錄</div><div class="v">${s.ft_people}</div></div>
    <div class="tile"><div class="k">複測人數</div><div class="v">${s.rt_people}<small class="muted">/過${s.rt_passed}</small></div></div>
    <div class="tile"><div class="k">今日已測</div><div class="v ok">${s.dq_today_done}</div></div>
    <div class="tile"><div class="k">今日全對</div><div class="v ok">${s.dq_today_pass}</div></div>
    <div class="tile"><div class="k">每日測驗總筆數</div><div class="v">${s.dq_total_records}</div></div>
  </div>`;
}

async function boot(){
  if(!K){ view.innerHTML = `<div class="card"><div class="warn">缺少參數（?k=…）。</div></div>`; return; }
  DATA = await load();
  if(DATA.error){ view.innerHTML = `<div class="card"><div class="warn">讀取失敗（token 無效？）</div></div>`; return; }
  renderCross();
}

// ===== 個人總覽 =====
function renderCross(){
  view.innerHTML = tiles() + `<div class="card">
    <div class="row"><input id="q" placeholder="搜尋工號或姓名" style="flex:1;min-width:180px">
      <button class="sec" id="csv">匯出 CSV</button>
      <button class="sec" id="rf">🔄 重新整理</button></div>
    <div class="muted" style="font-size:12px;margin-bottom:8px">點欄位標題可排序。首測＝7月教育訓練首測；複測＝常錯題複測；每日＝每日三題測驗。</div>
    <div id="tbl"></div></div>`;
  document.getElementById("csv").onclick = csvCross;
  document.getElementById("rf").onclick = boot;
  const q = document.getElementById("q");
  q.oninput = ()=>drawCross(q.value.trim());
  drawCross("");
}
function sortRows(rows){
  return rows.slice().sort((a,b)=>{
    let x=a[sortKey], y=b[sortKey];
    if(typeof x==="boolean"){x=x?1:0;y=y?1:0;}
    if(x==null)x=-1; if(y==null)y=-1;
    if(typeof x==="string") return sortDir*x.localeCompare(y);
    return sortDir*(x-y);
  });
}
function drawCross(filter){
  let rows = DATA.cross;
  if(filter){ const f=filter.toLowerCase(); rows = rows.filter(r=>(r.emp||"").includes(filter)||(r.name||"").toLowerCase().includes(f)); }
  rows = sortRows(rows);
  const th=(k,label)=>`<th data-k="${k}">${label}${sortKey===k?(sortDir<0?" ▼":" ▲"):""}</th>`;
  const body = rows.map(r=>`<tr>
    <td>${esc(r.emp)}</td><td>${esc(r.name)}</td><td>${esc(r.company)}</td><td>${esc(r.center||"")}</td>
    <td>${r.ft_seen?`${esc(r.ft_jobs.join("/"))}${r.ft_wrong?` <span class="warn">錯${r.ft_wrong}</span>`:` <span class="ok">全對</span>`}`:'<span class="dot">—</span>'}</td>
    <td>${r.rt_done?`${r.rt_score}/${r.rt_total} <span class="pill ${r.rt_passed?'pass':'fail'}">${r.rt_passed?'過':'未過'}</span>`:'<span class="dot">—</span>'}</td>
    <td>${r.dq_days>0?`${r.dq_days}次 / 過${r.dq_pass}`:'<span class="dot">—</span>'}</td>
    <td>${r.dq_last!=null?r.dq_last:'<span class="dot">—</span>'}</td>
    <td>${r.dq_today?'<span class="pill pass">已測</span>':'<span class="dot">未</span>'}</td>
  </tr>`).join("");
  document.getElementById("tbl").innerHTML = `<div class="tblwrap"><table><thead><tr>
    ${th("emp","工號")}${th("name","姓名")}${th("company","公司")}${th("center","中心")}
    ${th("ft_wrong","首測(工種/錯題)")}${th("rt_passed","複測")}${th("dq_days","每日次數")}${th("dq_last","最近分")}${th("dq_today","今日")}
  </tr></thead><tbody>${body||'<tr><td colspan="9" class="muted">無資料</td></tr>'}</tbody></table></div>
  <div class="muted" style="font-size:12px;margin-top:8px">顯示 ${rows.length} 人</div>`;
  document.querySelectorAll("#tbl th").forEach(th=>{
    th.onclick=()=>{ const k=th.dataset.k; if(sortKey===k)sortDir*=-1; else{sortKey=k;sortDir=-1;} drawCross(document.getElementById("q").value.trim()); };
  });
}
function csvCross(){
  const head=["工號","姓名","公司","中心","首測工種","首測錯題","複測分數","複測滿分","複測通過","每日次數","每日通過","最近分","今日已測"];
  const lines=[head.join(",")];
  for(const r of DATA.cross){
    lines.push([r.emp,r.name,r.company,r.center||"",r.ft_jobs.join("/"),r.ft_wrong,
      r.rt_done?r.rt_score:"",r.rt_done?r.rt_total:"",r.rt_done?(r.rt_passed?"是":"否"):"",
      r.dq_days,r.dq_pass,r.dq_last??"",r.dq_today?"是":"否"]
      .map(x=>`"${String(x).replace(/"/g,'""')}"`).join(","));
  }
  const blob=new Blob(["﻿"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="整合總覽.csv";a.click();
}

// ===== 今日每日測驗 =====
function renderDaily(){
  const rows = DATA.daily_today||[];
  const body = rows.map(r=>`<tr><td>${esc(r.center||"")}</td><td>${esc(r.emp)}</td><td>${esc(r.name)}</td>
    <td>${r.score}/${r.total} <span class="pill ${r.passed?'pass':'fail'}">${r.passed?'通過':'未過'}</span></td>
    <td>${new Date(r.created_at).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})}</td></tr>`).join("");
  view.innerHTML = tiles() + `<div class="card"><b>今日（${DATA.today}）每日測驗　${rows.length} 人</b>
    <div class="tblwrap" style="margin-top:10px"><table><thead><tr><th>中心</th><th>工號</th><th>姓名</th><th>分數</th><th>交卷</th></tr></thead>
    <tbody>${body||'<tr><td colspan="5" class="muted">今日尚無人作答</td></tr>'}</tbody></table></div>
    <div class="muted" style="font-size:12px;margin-top:8px">完整每日測驗管理（延後審核、歷史日期、題庫）請用 daily-admin 看板。</div></div>`;
}

// ===== 常錯題複測 =====
function renderRetest(){
  const rows = DATA.retest||[];
  const body = rows.map(r=>`<tr><td>${esc(r.emp)}</td><td>${esc(r.name)}</td><td>${esc(r.company||"")}</td>
    <td>${r.score}/${r.total} <span class="pill ${r.passed?'pass':'fail'}">${r.passed?'通過':'未過'}</span></td>
    <td>${r.created_at?new Date(r.created_at).toLocaleString('zh-TW'):''}</td></tr>`).join("");
  view.innerHTML = tiles() + `<div class="card"><b>常錯題複測　共 ${rows.length} 筆</b>
    <div class="tblwrap" style="margin-top:10px"><table><thead><tr><th>工號</th><th>姓名</th><th>公司</th><th>分數</th><th>時間</th></tr></thead>
    <tbody>${body||'<tr><td colspan="5" class="muted">尚無複測紀錄</td></tr>'}</tbody></table></div></div>`;
}

boot();
</script>
</body>
</html>
