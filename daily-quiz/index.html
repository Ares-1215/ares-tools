<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>新竹物流 轉運中心-人員安全教育訓練 · 每日測驗</title>
<style>
  :root{--bg:#f4f6f9;--card:#fff;--ink:#1a2330;--muted:#66738a;--line:#e3e8ef;
    --brand:#0b6b3a;--brand2:#12945a;--accent:#1565c0;--warn:#c62828;--warnbg:#fdecea;
    --okbg:#e8f5ec;--chip:#eef2f7;--shadow:0 1px 3px rgba(20,40,70,.08),0 6px 18px rgba(20,40,70,.05)}
  @media (prefers-color-scheme:dark){:root{--bg:#0f141b;--card:#161d27;--ink:#e6ebf2;--muted:#93a1b5;
    --line:#26313f;--brand:#38c07f;--brand2:#2ea36a;--accent:#5aa2e6;--warn:#ff6b6b;--warnbg:#3a1f22;
    --okbg:#183026;--chip:#1e2733;--shadow:0 1px 3px rgba(0,0,0,.4)}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.6}
  .wrap{max-width:560px;margin:0 auto;padding:16px 14px 60px}
  header{text-align:center;margin:8px 0 16px}
  header h1{font-size:20px;margin:0;font-weight:800}
  header .sub{color:var(--muted);font-size:13px;margin-top:4px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
    padding:18px 16px;margin-bottom:16px}
  label{display:block;font-size:14px;font-weight:700;margin:12px 0 5px}
  input,select{width:100%;background:var(--bg);border:1.5px solid var(--line);color:var(--ink);
    border-radius:10px;padding:12px;font-size:16px}
  input:focus,select:focus{outline:none;border-color:var(--brand)}
  .hint{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.7;
    background:var(--chip);border-radius:8px;padding:8px 10px}
  .hint b{color:var(--ink)}
  button{width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:800;
    cursor:pointer;background:var(--brand);color:#fff;margin-top:16px}
  button:disabled{opacity:.5}
  button.sec{background:var(--chip);color:var(--ink)}
  .q{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;background:var(--card)}
  .q .jt{display:inline-block;background:var(--brand);color:#fff;font-size:12px;font-weight:800;
    padding:2px 10px;border-radius:20px;margin-bottom:8px}
  .q .qt{font-size:16px;font-weight:600;margin-bottom:10px}
  .opt{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:10px;
    padding:12px;margin-bottom:8px;cursor:pointer;font-size:15px;background:var(--bg)}
  .opt.sel{border-color:var(--brand);background:var(--okbg)}
  .opt input{width:auto;margin:0;accent-color:var(--brand)}
  .bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;text-align:center;
    font-size:14px;font-weight:700}
  .bar .cd{color:var(--warn)}
  .msg{border-radius:12px;padding:14px;font-size:15px;margin-bottom:14px}
  .msg.warn{background:var(--warnbg);color:var(--warn);border:1px solid var(--warn)}
  .msg.ok{background:var(--okbg);color:var(--brand);border:1px solid var(--brand)}
  .big{font-size:34px;font-weight:800;text-align:center;margin:6px 0}
  .center{text-align:center}
  .rowk{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;border-bottom:1px dashed var(--line)}
  .wrongq{border-left:3px solid var(--warn);padding:8px 10px;margin:8px 0;background:var(--warnbg);border-radius:0 8px 8px 0;font-size:14px}
  .wrongq .c{color:var(--brand);font-weight:700}
  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}
  .lock{font-size:13px;color:var(--muted);margin-top:6px}
  /* ── 手機版微調（≤480px）：收窄留白、標題不過大 ── */
  @media (max-width:480px){
    .wrap{padding:14px 12px 48px}
    header h1{font-size:18px;line-height:1.4}
    .card{padding:16px 14px}
    button{padding:13px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🦺 新竹物流 轉運中心-人員安全教育訓練 · 每日測驗</h1>
    <div class="sub">拆櫃 · 拉線 · 疊櫃　每日三題　·　截止時間依單位而定</div>
  </header>
  <div id="app"><div class="card center">載入中…</div></div>
  <div class="foot">新竹物流轉運中心 · 人員教育訓練每日測驗</div>
</div>

<script>
const API = "https://hmqnlovyzlvvnkqmfwtt.supabase.co/functions/v1/daily";
const K = new URLSearchParams(location.search).get("k") || "";
const app = document.getElementById("app");
const esc = s => (s ?? "").replace(/[&<>]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c]));

// 持久化 device_id（每支手機唯一）
function deviceId(){
  let d = localStorage.getItem("daily_device");
  if(!d){ d = "d-" + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem("daily_device", d); }
  return d;
}
const savedEmp = () => localStorage.getItem("daily_emp") || "";
const savedName = () => localStorage.getItem("daily_name") || "";

async function api(action, opts={}){
  const isPost = !!opts.body;
  const res = await fetch(`${API}?action=${action}&k=${encodeURIComponent(K)}`, {
    method: isPost ? "POST" : "GET",
    headers: isPost ? {"Content-Type":"application/json"} : {},
    body: isPost ? JSON.stringify(opts.body) : undefined,
  });
  return res.json();
}

let STATE = { questions: [], answers: {}, deadline: 0, startTs: 0, emp: "", name: "", center: "", unit: "", timer: null };

function fmtLeft(ms){
  if(ms<=0) return "已截止";
  const m = Math.floor(ms/60000), s = Math.floor(ms%60000/1000);
  return `${m} 分 ${String(s).padStart(2,"0")} 秒`;
}
// deadline 為 +8 時區位移空間，直接切 ISO 即為台北時分
function fmtDeadline(shiftMs){ const iso = new Date(shiftMs).toISOString();
  return iso.slice(5,7)+"/"+iso.slice(8,10)+" "+iso.slice(11,16); }

async function boot(){
  if(!K){ app.innerHTML = `<div class="card"><div class="msg warn">缺少測驗連結參數（?k=…），請向承辦索取正確網址。</div></div>`; return; }
  const t = await api("today");
  if(t.error){ app.innerHTML = `<div class="card"><div class="msg warn">連線失敗或連結無效。</div></div>`; return; }
  renderLogin();
}

async function loadCenters(sel){
  const r = await api("centers");
  const list = (r.centers||[]);
  sel.innerHTML = `<option value="">請選擇轉運中心</option>` + list.map(c=>`<option>${esc(c)}</option>`).join("");
}

function renderLogin(){
  app.innerHTML = `
  <div class="card">
    <label>轉運中心</label>
    <select id="center"><option>載入中…</option></select>
    <label>單位</label>
    <select id="unit">
      <option value="">請選擇單位</option>
      <option value="發送單位">發送單位</option>
      <option value="到著單位">到著單位</option>
    </select>
    <div id="dlHint" class="hint" style="display:none;margin-top:8px"></div>
    <label>工號</label>
    <input id="emp" inputmode="numeric" placeholder="請輸入工號" value="${esc(savedEmp())}" autocomplete="off">
    <div class="hint">外包工號為 <b>8 碼</b>。（有根人力公司→工號 <b>10</b> 開頭、丞閎人力公司→工號 <b>20</b> 開頭、信林人力公司→工號 <b>30</b> 開頭）＋身分證字號後 6 碼。<br>新竹物流員工可只輸入 <b>5 碼</b>，系統會自動在前面補 0。</div>
    <label>姓名</label>
    <input id="name" placeholder="請輸入姓名" value="${esc(savedName())}" autocomplete="off">
    <button id="go">開始測驗</button>
    <div class="lock" id="lock"></div>
  </div>`;
  loadCenters(document.getElementById("center")).then(()=>{
    const c = localStorage.getItem("daily_center"); if(c) document.getElementById("center").value = c;
    updateDeadlineHint();
  });
  const u = localStorage.getItem("daily_unit"); if(u) document.getElementById("unit").value = u;
  document.getElementById("center").onchange = updateDeadlineHint;
  document.getElementById("unit").onchange = updateDeadlineHint;
  document.getElementById("go").onclick = doLogin;
}

// 選完中心＋單位即查詢並提示當日作答截止時間
async function updateDeadlineHint(){
  const box = document.getElementById("dlHint"); if(!box) return;
  const center = document.getElementById("center").value.trim();
  const unit = document.getElementById("unit").value.trim();
  if(!center || !unit){ box.style.display="none"; return; }
  box.style.display="block"; box.textContent = "查詢截止時間中…";
  const r = await api("deadline_of", { body:{ center, unit } });
  if(r && r.deadline){
    const dt = fmtDeadline(r.deadline);
    box.innerHTML = r.past
      ? `⛔ <b>${esc(unit)}</b> 今日作答時間已截止（${dt}）。如需補測請聯繫陳尚福（工號 26516）核准延後。`
      : `⏰ <b>${esc(unit)}</b> 作答截止時間：<b>${dt}</b>（${r.day_offset?"隔日":"當日"} ${esc(r.hhmm)}）`;
  } else { box.style.display="none"; }
}

async function doLogin(){
  const center = document.getElementById("center").value.trim();
  const unit = document.getElementById("unit").value.trim();
  const emp = document.getElementById("emp").value.trim();
  const name = document.getElementById("name").value.trim();
  const lock = document.getElementById("lock");
  lock.textContent = "";
  if(!center){ lock.textContent = "請選擇轉運中心。"; return; }
  if(!unit){ lock.textContent = "請選擇單位（發送／到著）。"; return; }
  if(!emp){ lock.textContent = "請輸入工號。"; return; }
  if(!name){ lock.textContent = "請輸入姓名。"; return; }
  const btn = document.getElementById("go"); btn.disabled = true; btn.textContent = "登入中…";
  const r = await api("login", { body:{ emp_id:emp, name, center, unit, device_id:deviceId() } });
  btn.disabled = false; btn.textContent = "開始測驗";
  if(!r.ok){
    const m = { bad_emp:"工號格式不符（請輸入 8 碼；新竹物流可輸入 5 碼）。",
      empty_name:"請輸入姓名。",
      device_bound:`此手機已綁定「${esc(r.bound_name||"")}」，不可用其他工號登入。` }[r.reason] || "登入失敗，請稍後再試。";
    lock.textContent = m; return;
  }
  localStorage.setItem("daily_emp", r.emp_id);
  localStorage.setItem("daily_name", name);
  localStorage.setItem("daily_center", center);
  localStorage.setItem("daily_unit", unit);
  STATE = { ...STATE, emp:r.emp_id, name, center, unit, questions:r.questions, deadline:r.deadline, answers:{}, startTs:Date.now() };
  if(r.already_done){ renderDone(r.last); return; }
  if(r.past){ renderBlocked(); return; }
  renderQuiz(r.company);
}

function renderQuiz(company){
  const qhtml = STATE.questions.map((q,i)=>{
    const opts = q.options.map(o=>`
      <label class="opt" data-q="${q.id}" data-v="${esc(o)}">
        <input type="radio" name="q${q.id}" value="${esc(o)}">
        <span>${esc(o)}</span>
      </label>`).join("");
    return `<div class="q"><span class="jt">${esc(q.job_type)}</span>
      <div class="qt">${i+1}. ${esc(q.question)}</div>${opts}</div>`;
  }).join("");
  app.innerHTML = `
    <div class="bar">⏳ 距截止：<span class="cd" id="cd"></span>　<span style="color:var(--muted);font-weight:600">（${esc(STATE.unit||"")}截止 ${fmtDeadline(STATE.deadline)}）</span></div>
    <div class="card" style="padding:12px 14px">
      <div style="font-size:14px;color:var(--muted)">作答人：<b style="color:var(--ink)">${esc(STATE.name)}</b>（${esc(STATE.emp)}／${esc(company||"")}）· ${esc(STATE.center)}${STATE.unit?" · "+esc(STATE.unit):""}</div>
    </div>
    ${qhtml}
    <button id="submit">交卷</button>
    <div class="lock" id="serr"></div>`;
  app.querySelectorAll(".opt").forEach(el=>{
    el.onclick = ()=>{
      const qid = el.dataset.q;
      app.querySelectorAll(`.opt[data-q="${qid}"]`).forEach(x=>x.classList.remove("sel"));
      el.classList.add("sel"); el.querySelector("input").checked = true;
      STATE.answers[qid] = el.dataset.v;
    };
  });
  document.getElementById("submit").onclick = doSubmit;
  tick();
  STATE.timer = setInterval(tick, 1000);
}

function tick(){
  const cd = document.getElementById("cd"); if(!cd){ clearInterval(STATE.timer); return; }
  // 伺服器 deadline 為「+8 時區位移」空間，與本機同樣位移後比較
  const nowShift = Date.now() + 8*3600000;
  const ms = STATE.deadline - nowShift;
  cd.textContent = fmtLeft(ms);
  if(ms<=0){ clearInterval(STATE.timer); cd.textContent="已截止"; }
}

async function doSubmit(){
  const unanswered = STATE.questions.filter(q=>!STATE.answers[q.id]);
  if(unanswered.length){ document.getElementById("serr").textContent = `還有 ${unanswered.length} 題未作答。`; return; }
  const btn = document.getElementById("submit"); btn.disabled = true; btn.textContent = "交卷中…";
  const answers = STATE.questions.map(q=>({ id:q.id, chosen:STATE.answers[q.id] }));
  const r = await api("submit", { body:{
    emp_id:STATE.emp, name:STATE.name, center:STATE.center, unit:STATE.unit, device_id:deviceId(),
    duration_sec:Math.round((Date.now()-STATE.startTs)/1000), answers } });
  clearInterval(STATE.timer);
  if(!r.ok){
    btn.disabled=false; btn.textContent="交卷";
    const m = { already_done:"你今天已經作答過了。", past_deadline:"已超過今日截止時間，請聯繫陳尚福（工號 26516）核准延後後再作答。",
      device_bound:"此手機已綁定其他工號。", bad_emp:"工號格式不符。" }[r.reason] || "交卷失敗，請稍後再試。";
    if(r.reason==="past_deadline"){ renderBlocked(); return; }
    if(r.reason==="already_done"){ renderDone(null); return; }
    document.getElementById("serr").textContent = m; return;
  }
  renderResult(r);
}

function renderResult(r){
  const wrong = (r.wrong||[]).map(w=>`
    <div class="wrongq">【${esc(w.job_type)}】${esc(w.question)}<br>
      你的作答：${esc(w.chosen||"（未答）")}　→　正解：<span class="c">${esc(w.correct)}</span></div>`).join("");
  app.innerHTML = `
    <div class="card center">
      <div class="msg ${r.passed?"ok":"warn"}">${r.passed?"✅ 全部答對，通過！":"⚠️ 未全對，請看下方正解訂正"}</div>
      <div class="big">${r.score} / ${r.total}</div>
      <div style="color:var(--muted);font-size:13px">${esc(STATE.name)}（${esc(STATE.emp)}）· ${esc(STATE.center)}</div>
    </div>
    ${wrong ? `<div class="card"><b>錯題訂正</b>${wrong}</div>` : ""}
    <div class="card center" style="color:var(--muted);font-size:13px">今日測驗已完成，明天再來作答新題目。</div>`;
}

function renderDone(last){
  app.innerHTML = `<div class="card center">
    <div class="msg ok">✅ 你今天已完成測驗</div>
    ${last?`<div class="big">${last.score} / ${last.total}</div>`:""}
    <div style="color:var(--muted);font-size:13px">每人每日限作答一次，明天再來。</div></div>`;
}

function renderBlocked(){
  app.innerHTML = `<div class="card center">
    <div class="msg warn">⛔ 已超過本單位今日截止時間${STATE.deadline?`（${fmtDeadline(STATE.deadline)}）`:""}</div>
    <div style="font-size:15px;margin:8px 0">如需補測，請聯繫 <b>陳尚福（工號 26516）</b> 核准延後（每次 +30 分鐘），核准後重新整理本頁即可作答。</div>
    <button class="sec" onclick="location.reload()">重新整理</button></div>`;
}

boot();
</script>
</body>
</html>
