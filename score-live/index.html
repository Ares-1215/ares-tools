<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>彰化轉運中心 發送單位｜人員教育訓練成績管理（即時）</title>
<style>
  :root{
    --bg:#f4f6f9; --card:#ffffff; --ink:#1a2330; --muted:#66738a; --line:#e3e8ef;
    --brand:#0b6b3a; --brand2:#12945a; --accent:#1565c0; --warn:#c62828; --warnbg:#fdecea;
    --okbg:#e8f5ec; --chip:#eef2f7; --shadow:0 1px 3px rgba(20,40,70,.08),0 6px 18px rgba(20,40,70,.05);
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0f141b;--card:#161d27;--ink:#e6ebf2;--muted:#93a1b5;--line:#26313f;
      --brand:#38c07f;--brand2:#2ea36a;--accent:#5aa2e6;--warn:#ff6b6b;
      --warnbg:#3a1f22;--okbg:#183026;--chip:#1e2733;--shadow:0 1px 3px rgba(0,0,0,.4);}
  }
  :root[data-theme="dark"]{--bg:#0f141b;--card:#161d27;--ink:#e6ebf2;--muted:#93a1b5;--line:#26313f;
    --brand:#38c07f;--brand2:#2ea36a;--accent:#5aa2e6;--warn:#ff6b6b;--warnbg:#3a1f22;--okbg:#183026;--chip:#1e2733;}
  :root[data-theme="light"]{--bg:#f4f6f9;--card:#fff;--ink:#1a2330;--muted:#66738a;--line:#e3e8ef;
    --brand:#0b6b3a;--brand2:#12945a;--accent:#1565c0;--warn:#c62828;--warnbg:#fdecea;--okbg:#e8f5ec;--chip:#eef2f7;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.5}
  .wrap{max-width:1600px;margin:0 auto;padding:18px 22px 60px}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  h1{font-size:20px;margin:0;font-weight:800;letter-spacing:.3px}
  .sub{color:var(--muted);font-size:13px;margin:2px 0 16px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
  .tile .k{font-size:12px;color:var(--muted);font-weight:600}
  .tile .v{font-size:26px;font-weight:800;margin-top:3px}
  .tile .v small{font-size:13px;color:var(--muted);font-weight:600}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .fgrp{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
  .flbl{color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap}
  .frange{display:inline-flex;align-items:center;gap:6px;flex-wrap:nowrap}
  .seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
  .seg button{border:0;background:transparent;color:var(--muted);padding:7px 13px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
  .seg-main{padding:4px;gap:4px;margin-bottom:4px}
  .seg-main button{padding:11px 20px;font-size:15px;border:1.5px solid transparent}
  .seg-main button.on{background:var(--card);color:var(--brand);box-shadow:var(--shadow);border-color:var(--brand)}
  input[type=search]{flex:1;min-width:180px;background:var(--card);border:1px solid var(--line);color:var(--ink);
    border-radius:10px;padding:9px 12px;font-size:14px}
  select{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:9px 10px;font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px}
  .card h2{font-size:15px;margin:0;padding:13px 16px;border-bottom:1px solid var(--line);font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card h2 .h2note{font-weight:600;font-size:12px;color:var(--muted)}
  .tblwrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:13.5px}
  th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--card)}
  th.num,td.num{text-align:right}
  tbody tr:hover{background:var(--chip)}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700}
  .pill.ok{background:var(--okbg);color:var(--brand)}
  .pill.warn{background:var(--warnbg);color:var(--warn)}
  .pill.mut{background:var(--chip);color:var(--muted)}
  .rate{font-weight:800}
  .mini{height:6px;background:var(--chip);border-radius:4px;overflow:hidden;min-width:70px;display:inline-block;vertical-align:middle}
  .mini>i{display:block;height:100%;background:var(--brand2)}
  .job{font-size:11px;font-weight:800;padding:1px 7px;border-radius:6px;background:var(--chip);color:var(--muted);margin-right:3px}
  .wperson{border-bottom:1px solid var(--line);padding:12px 16px}
  .wperson:last-child{border-bottom:0}
  .wname{font-weight:800;font-size:14px;margin-bottom:7px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .wname .cnt{background:var(--warnbg);color:var(--warn);border-radius:999px;font-size:11px;padding:1px 8px;font-weight:800}
  .wq{font-size:12.5px;color:var(--muted);padding:6px 0;border-top:1px dashed var(--line);display:grid;grid-template-columns:88px 46px 1fr;gap:8px;align-items:start}
  .wq .qt{color:var(--ink)}
  .wq .ans{font-size:11.5px}
  .wq .x{color:var(--warn);font-weight:700}
  .wq .o{color:var(--brand);font-weight:700}
  .empty{padding:30px;text-align:center;color:var(--muted)}
  .foot{color:var(--muted);font-size:12px;text-align:center;margin-top:24px;line-height:1.7}
  .theme-btn{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:9px;padding:7px 10px;cursor:pointer;font-size:13px}
  .theme-btn:hover{color:var(--ink)}
  .nameL{color:var(--accent);font-weight:700;cursor:pointer;text-decoration:none;border-bottom:1px dotted var(--accent)}
  .nameL:hover{opacity:.75}
  .note{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:12px;box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden}
  .note>summary{cursor:pointer;list-style:none;padding:12px 16px;font-weight:800;font-size:13.5px;display:flex;align-items:center;gap:8px}
  .note>summary::-webkit-details-marker{display:none}
  .note>summary::before{content:"▸";color:var(--accent);font-weight:800}
  .note[open]>summary::before{content:"▾"}
  .note .body{padding:2px 16px 15px;font-size:13px;color:var(--muted);line-height:1.75}
  .note .qq{color:var(--ink);font-weight:700}
  .note .ans{color:var(--brand);font-weight:800}
  .note p{margin:9px 0 0}
  /* 說明面板：只有小按鈕能開關，避免誤觸整條橫幅 */
  .noteh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;font-weight:800;font-size:13.5px;color:var(--ink)}
  .notebtn{border:1px solid var(--line);background:var(--chip);color:var(--muted);border-radius:8px;padding:4px 11px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0}
  .notebtn:hover{color:var(--ink)}
  .bl{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
  .bl th,.bl td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}
  .bl th:first-child,.bl td:first-child{text-align:left}
  .bl th{color:var(--muted);font-size:11.5px;font-weight:700;background:transparent}
  .bl tr.jobrow td{font-weight:800}
  .bl tr.sub td:first-child{padding-left:26px;color:var(--muted);font-weight:600}
  .bl .over{color:var(--accent);font-weight:800}
  .bl .under{color:var(--warn);font-weight:800}
  .bl .mut{color:var(--muted)}
  .achbar{display:inline-block;width:96px;height:8px;background:var(--chip);border-radius:5px;position:relative;overflow:hidden;vertical-align:middle;margin-right:6px}
  .achbar>i{display:block;height:100%;border-radius:5px}
  .achbar>.mk{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--muted);opacity:.7}
  .tilenote{color:var(--muted);font-size:12px;margin:-8px 0 16px;line-height:1.6}
  .rank-q{white-space:normal;min-width:200px;max-width:400px;color:var(--ink)}
  .rank-c{white-space:normal;min-width:110px;max-width:190px;color:var(--brand);font-weight:700}
  .rnk{display:inline-block;min-width:24px;text-align:center;font-weight:800;color:var(--warn)}
  .rank-no{padding:11px 16px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);line-height:1.7}
  /* 圖表（純 CSS，無外部庫） */
  .chart{display:flex;align-items:flex-end;gap:7px;padding:16px 16px 34px;overflow-x:auto;min-height:180px}
  .cbar{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:26px}
  .cbar-track{height:120px;width:22px;background:var(--chip);border-radius:5px;display:flex;align-items:flex-end;overflow:hidden}
  .cbar-track>i{display:block;width:100%;border-radius:5px 5px 0 0;transition:height .3s}
  .cbar-val{font-size:10.5px;font-weight:800;color:var(--muted)}
  .cbar-x{font-size:10.5px;color:var(--muted);white-space:nowrap;transform:rotate(-45deg);transform-origin:center top;margin-top:5px}
  /* 複測追蹤 未通過卡 */
  .np{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;padding:14px 16px}
  .npcard{border:1px solid var(--warn);background:var(--warnbg);border-radius:12px;padding:11px 13px}
  .npcard .nm{font-weight:800;font-size:14px;color:var(--warn);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .npcard .qq{font-size:12.5px;color:var(--ink);margin-top:6px;white-space:normal}
  .npcard .aa{font-size:11.5px;color:var(--muted);margin-top:4px}
  /* Modal 個人詳情 */
  .modal{position:fixed;inset:0;background:rgba(10,18,30,.55);display:flex;align-items:flex-start;justify-content:center;padding:28px 14px;z-index:50;overflow-y:auto}
  .mbox{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.35);max-width:820px;width:100%;overflow:hidden}
  .mhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
  .mhead .mt{font-size:17px;font-weight:800;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .mhead .ms{color:var(--muted);font-size:12.5px;margin-top:4px}
  .mclose{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:9px;padding:5px 11px;cursor:pointer;font-size:16px;line-height:1}
  .mstat{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px 4px}
  .mstat .ms1{background:var(--chip);border-radius:10px;padding:7px 12px;font-size:12px;color:var(--muted);font-weight:600}
  .mstat .ms1 b{color:var(--ink);font-size:15px;font-weight:800}
  .mbody{padding:8px 18px 18px}
  .mdate{color:var(--ink);font-weight:700}
  .loading{padding:50px;text-align:center;color:var(--muted)}
  .spin{display:inline-block;width:20px;height:20px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:s .8s linear infinite;vertical-align:-4px;margin-right:8px}
  @keyframes s{to{transform:rotate(360deg)}}
  .hide{display:none}
  /* 列印 */
  @media print{
    body{background:#fff}
    .wrap{max-width:none;padding:0}
    .noprint{display:none !important}
    .note{break-inside:avoid}
    .card,.tile{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
    th{position:static}
    .modal{position:static;background:none;padding:0}
    .mbox{box-shadow:none;border:0}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>🏢 彰化轉運中心 · 發送單位</h1>
      <div class="sub" id="subLine">人員教育訓練成績管理　拆櫃 · 拉線 · 疊櫃</div>
    </div>
    <div class="toolbtns noprint" style="display:flex;gap:8px">
      <button class="theme-btn" id="csvBtn">⬇ 匯出 CSV</button>
      <button class="theme-btn" id="printBtn">🖨 列印</button>
      <button class="theme-btn" id="themeBtn">🌓 主題</button>
    </div>
  </header>

  <div id="app">
    <div class="loading"><span class="spin"></span>正在從 Supabase 讀取成績資料…</div>
  </div>

  <div class="foot">
    資料來源：Google 表單回覆（僅彰化轉運中心・發送單位）· <span id="fUpdated">–</span> 直讀 Google Drive <span id="fForms">–</span> 份表單全量對帳｜7月：每日一題 0/100；8月起：理貨合併三題（見「理貨成績」分頁）<br>
    即時檢視 · 資料每 5 分鐘自動更新 · 共 <span id="fCount">–</span> 筆人日紀錄
  </div>
</div>

<div id="modal" class="modal hide"><div class="mbox" id="mbox"></div></div>

<script>
// 即時版：不含任何金鑰。資料經 token 保護的 Edge Function 取得。
const FN_URL = "https://hmqnlovyzlvvnkqmfwtt.supabase.co/functions/v1/records";
const TOKEN = new URLSearchParams(location.search).get("k") || "";

let ALL = [];      // all records
let RETEST = [];   // retest_records（複測制，主管建議#2）
let DATES = [];    // distinct sorted dates
let state = { mode: "july", job: "全部", view: "people", aview: "overview", q: "", from: "", to: "", sortKey: "wrongRate", sortDir: -1, company: "全部", year: "全部", month: "全部" };

const dateOK = r => (!state.from || r.test_date >= state.from) && (!state.to || r.test_date <= state.to);
// 7月模式（拆/拉/疊 每日單題）與 8月模式（理貨 合併三題）分流：
// 「全部」及拆/拉/疊 各分頁一律排除理貨；8月理貨資料只在「理貨成績（8月開始實施）」分頁呈現。
const jobOK = r => r.job_type !== "理貨" && (state.job === "全部" || r.job_type === state.job);
const qOK = r => { if (!state.q) return true; const q = state.q.trim(); return r.name.includes(q) || (r.emp_id || "").includes(q); };
const companyOK = r => state.company === "全部" || companyOf(r.emp_id) === state.company;
// 各主模式的日期池：7月＝拆/拉/疊 每日單題；8月＝理貨（8月開始實施）。用工種歸屬取日期，不寫死界線
const modeDates = () => [...new Set(ALL.filter(r => state.mode === "august" ? r.job_type === "理貨" : r.job_type !== "理貨").map(r => r.test_date))].sort();
function resetRange() { const ds = modeDates(); state.year = "全部"; state.month = "全部"; state.from = ds[0]; state.to = ds[ds.length - 1]; }

// ---- theme ----
document.getElementById("themeBtn").onclick = () => {
  const r = document.documentElement;
  const cur = r.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light");
  r.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
};
document.getElementById("csvBtn").onclick = exportCSV;
document.getElementById("printBtn").onclick = () => window.print();

// ---- aggregation ----
function personRows() {
  const map = new Map();
  for (const r of ALL) {
    if (!jobOK(r)) continue;
    if (!companyOK(r)) continue;
    if (!dateOK(r)) continue;
    let p = map.get(r.name);
    if (!p) { p = { name: r.name, emp_id: r.emp_id, total: 0, wrong: 0, notpass: 0, jobs: new Set() }; map.set(r.name, p); }
    p.total++; if (r.is_wrong) p.wrong++; if (!r.passed) p.notpass++; p.jobs.add(r.job_type);
    if (!p.emp_id && r.emp_id) p.emp_id = r.emp_id;
  }
  let arr = [...map.values()].map(p => ({ ...p, right: p.total - p.wrong,
    rightRate: p.total ? (p.total - p.wrong) / p.total : 0,
    wrongRate: p.total ? p.wrong / p.total : 0, jobs: [...p.jobs] }));
  if (state.q) { const q = state.q.trim(); arr = arr.filter(p => p.name.includes(q) || (p.emp_id || "").includes(q)); }
  const k = state.sortKey, d = state.sortDir;
  arr.sort((a, b) => { let x = a[k], y = b[k];
    if (typeof x === "string") return d * x.localeCompare(y, "zh-Hant");
    return d * ((x > y ? 1 : x < y ? -1 : 0)) || a.name.localeCompare(b.name, "zh-Hant"); });
  return arr;
}

function wrongData() {
  const map = new Map();
  for (const r of ALL) {
    if (!r.is_wrong) continue;
    if (!jobOK(r)) continue;
    if (!companyOK(r)) continue;
    if (!dateOK(r)) continue;
    if (!qOK(r)) continue;
    if (!map.has(r.name)) map.set(r.name, []);
    map.get(r.name).push(r);
  }
  const arr = [...map.entries()].map(([name, items]) => ({ name, emp_id: items[0].emp_id, items:
    items.sort((a, b) => a.test_date.localeCompare(b.test_date) || a.job_type.localeCompare(b.job_type)) }));
  arr.sort((a, b) => b.items.length - a.items.length || a.name.localeCompare(b.name, "zh-Hant"));
  return arr;
}

function stats() {
  const rows = ALL.filter(r => jobOK(r) && dateOK(r) && companyOK(r));
  const total = rows.length, wrong = rows.filter(r => r.is_wrong).length;
  const people = new Set(rows.map(r => r.name)).size;
  return { total, wrong, people, rightRate: total ? (total - wrong) / total : 0 };
}

function dailyData() {
  const map = new Map();
  for (const r of ALL) {
    if (!jobOK(r)) continue;
    if (!companyOK(r)) continue;
    if (!dateOK(r)) continue;
    const key = r.test_date + "|" + r.job_type;
    let d = map.get(key); if (!d) { d = { date: r.test_date, job: r.job_type, n: 0, wrong: 0 }; map.set(key, d); }
    d.n++; if (r.is_wrong) d.wrong++;
  }
  return [...map.values()].sort((a, b) => a.date.localeCompare(b.date) || a.job.localeCompare(b.job));
}

// 每日答對率（依工種篩選，跨工種合計）供圖表
function dailyRate() {
  const map = new Map();
  for (const r of ALL) {
    if (!jobOK(r)) continue;
    if (!companyOK(r)) continue;
    if (!dateOK(r)) continue;
    let d = map.get(r.test_date); if (!d) { d = { date: r.test_date, n: 0, wrong: 0 }; map.set(r.test_date, d); }
    d.n++; if (r.is_wrong) d.wrong++;
  }
  return [...map.values()].sort((a, b) => a.date.localeCompare(b.date))
    .map(d => ({ ...d, rate: d.n ? (d.n - d.wrong) / d.n : 0 }));
}

// ---- render ----
const pct = x => (x * 100).toFixed(1) + "%";
const esc = s => (s ?? "").toString().replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const d2 = s => (s || "").slice(5); // MM-DD
const retestOf = name => RETEST.filter(x => x.name === name)
  .sort((a, b) => (b.retest_date || "").localeCompare(a.retest_date || ""))[0];
function retestResultCell(name) {
  const rt = retestOf(name);
  if (!rt) return '<span class="pill mut">待複測</span>';
  const s = rt.score == null ? "" : rt.score + "分";
  return rt.passed ? `<span class="pill ok">${s}${s ? "·" : ""}通過</span>` : `<span class="pill warn">${s || "未通過"}</span>`;
}
function retestSignCell(name) {
  const rt = retestOf(name);
  if (!rt || !rt.teacher) return "＿＿＿＿＿";
  return esc(rt.teacher) + (rt.signed_date ? " · " + d2(rt.signed_date) : "");
}

// ---- 人力公司對照（依工號開頭）----
const companyOf = emp => { emp = (emp || "").trim(); if (emp.length > 8) return "其他"; const p = emp.slice(0, 2);
  return p === "10" ? "有根" : p === "20" ? "丞閎" : p === "30" ? "信林" : p === "00" ? "新竹物流正職" : "其他"; };

function render() {
  const s = stats();
  const md = modeDates();
  const hasLihuo = ALL.some(r => r.job_type === "理貨");
  const jobs = ["全部", "拆櫃", "拉線", "疊櫃"];
  const sub = document.getElementById("subLine");
  if (sub) sub.textContent = state.mode === "august"
    ? `理貨成績（8月開始實施）　${md.length ? md[0].replace(/-/g, "/") + " 起" : ""}`
    : `7月份資料分析　${md.length ? md[0].replace(/-/g, "/") + "–" + md[md.length - 1].slice(5).replace("-", "/") : ""}　拆櫃 · 拉線 · 疊櫃`;
  const fu = document.getElementById("fUpdated"); if (fu && DATES.length) fu.textContent = DATES[DATES.length - 1];
  const ff = document.getElementById("fForms"); if (ff) ff.textContent = new Set(ALL.map(r => r.test_date + "|" + r.job_type)).size;

  let h = "";
  // === 主模式列：7月份資料分析 / 理貨成績（8月開始實施）===
  h += `<div class="bar noprint">
    <div class="seg seg-main" id="modeSeg">
      <button class="${state.mode === "july" ? "on" : ""}" data-mode="july">📊 7月份資料分析</button>
      ${hasLihuo ? `<button class="${state.mode === "august" ? "on" : ""}" data-mode="august">📦 理貨成績（8月開始實施）</button>` : ""}
    </div>
  </div>`;

  // === 篩選列：日期池依當前模式（7月只給 7/1–7/31、8月只給 8月起）===
  const scoped = md.filter(d => (state.year === "全部" || d.slice(0, 4) === state.year) && (state.month === "全部" || d.slice(5, 7) === state.month));
  const dopt = (sel) => scoped.map(d => `<option value="${d}" ${d === sel ? "selected" : ""}>${d.slice(5)}</option>`).join("");
  const years = ["全部", ...[...new Set(md.map(d => d.slice(0, 4)))].sort()];
  const yearOpts = years.map(y => `<option value="${y}" ${y === state.year ? "selected" : ""}>${y === "全部" ? "全部年" : y + "年"}</option>`).join("");
  const months = ["全部", ...[...new Set(md.filter(d => state.year === "全部" || d.slice(0, 4) === state.year).map(d => d.slice(5, 7)))].sort()];
  const monthOpts = months.map(m => `<option value="${m}" ${m === state.month ? "selected" : ""}>${m === "全部" ? "全部月" : (+m) + "月"}</option>`).join("");
  const COMP_ORDER = ["信林", "有根", "丞閎", "新竹物流正職", "其他"];
  const compsPresent = ["全部", ...COMP_ORDER.filter(c => ALL.some(r => companyOf(r.emp_id) === c))];
  const compOpts = compsPresent.map(c => `<option value="${c}" ${c === state.company ? "selected" : ""}>${c}</option>`).join("");
  const isFiltered = md.length && (state.from !== md[0] || state.to !== md[md.length - 1]);
  const searchBox = `<input type="search" id="q" placeholder="🔍 搜尋姓名或工號" value="${esc(state.q)}">`;
  const filterBar = `<div class="bar noprint" style="margin-top:-6px">
    <span class="fgrp"><span class="flbl">🏢 人力公司</span>
      <select id="compSel">${compOpts}</select>
      ${state.company !== "全部" ? `<span style="color:var(--accent);font-size:12px;font-weight:700">僅 ${state.company}</span>` : ""}</span>
    <span class="fgrp"><span class="flbl">📅 期間</span>
      <select id="ySel">${yearOpts}</select>
      <select id="mSel">${monthOpts}</select>
      <span class="frange"><select id="dFrom">${dopt(state.from)}</select><span style="color:var(--muted)">–</span><select id="dTo">${dopt(state.to)}</select></span>
      <button class="theme-btn" id="dReset">全部</button>
      ${isFiltered ? `<span style="color:var(--accent);font-size:12px;font-weight:700">已篩選 ${state.from.slice(5)}~${state.to.slice(5)}</span>` : ""}</span>
  </div>`;

  if (state.mode === "august") {
    // === 8月理貨：獨立主視圖（子頁籤：總覽/逐題/公司/趨勢/分布）===
    const aviews = [["overview", "成績總覽"], ["perq", "逐題弱點"], ["company", "人力公司對比"], ["trend", "每日趨勢"], ["dist", "分數分布 · 待追蹤"]];
    h += `<div class="bar noprint">
      <div class="seg" id="aviewSeg">${aviews.map(([v, l]) => `<button class="${state.aview === v ? "on" : ""}" data-aview="${v}">${l}</button>`).join("")}</div>
      ${searchBox}
    </div>`;
    h += filterBar;
    h += renderLihuo();
  } else {
    // === 7月份資料分析：拆/拉/疊 各分頁 ===
    h += `<div class="tiles">
      <div class="tile"><div class="k">總測驗人次</div><div class="v">${s.total}</div></div>
      <div class="tile"><div class="k">受測人數</div><div class="v">${s.people} <small>人</small></div></div>
      <div class="tile"><div class="k">首測答對率</div><div class="v" style="color:var(--brand)">${pct(s.rightRate)}</div></div>
      <div class="tile"><div class="k">首測答錯人次</div><div class="v" style="color:var(--warn)">${s.wrong}</div></div>
    </div>`;
    h += `<div class="tilenote">💡 「受測人數」＝實際答題的<b>不重複姓名數</b>；因到工人員跨組安排，一人可能橫跨多個工種，故「總測驗人次」大於「受測人數」屬正常現象。點姓名可看<b>個人詳情</b>。</div>`;
    h += `<div class="bar noprint">
      <div class="seg" id="jobSeg">${jobs.map(j => `<button class="${state.job === j ? "on" : ""}" data-job="${j}">${j}</button>`).join("")}</div>
      <div class="seg" id="viewSeg">
        <button class="${state.view === "people" ? "on" : ""}" data-view="people">人員成績表</button>
        <button class="${state.view === "wrong" ? "on" : ""}" data-view="wrong">錯題統整</button>
        <button class="${state.view === "rank" ? "on" : ""}" data-view="rank">常錯題排行</button>
        <button class="${state.view === "retest" ? "on" : ""}" data-view="retest">複測追蹤</button>
        <button class="${state.view === "daily" ? "on" : ""}" data-view="daily">逐日總覽</button>
      </div>
      ${searchBox}
    </div>`;
    h += filterBar;

    if (state.view === "people") h += renderPeople();
    else if (state.view === "wrong") h += renderWrong();
    else if (state.view === "rank") h += renderRank();
    else if (state.view === "retest") h += renderRetest();
    else h += renderDaily();
  }

  document.getElementById("app").innerHTML = h;
  document.getElementById("fCount").textContent = ALL.length;
  bind();
}

function sortableTh(label, key, cls) {
  const on = state.sortKey === key;
  const arrow = on ? (state.sortDir === -1 ? " ▼" : " ▲") : "";
  return `<th class="${cls || ""}" data-sort="${key}">${label}${arrow}</th>`;
}

const nameLink = (name, emp) => `<span class="nameL" data-person="${esc(name)}">${esc(name)}</span>`;

function renderPeople() {
  const arr = personRows();
  let h = `<div class="card"><h2>人員成績資料表（${arr.length} 人）</h2><div class="tblwrap"><table><thead><tr>
    ${sortableTh("姓名", "name")}${sortableTh("工號", "emp_id")}<th>工種</th>
    ${sortableTh("參加天數", "total", "num")}${sortableTh("首測答對", "right", "num")}
    ${sortableTh("首測答錯", "wrong", "num")}${sortableTh("答對率", "rightRate", "num")}
    ${sortableTh("曾未通過", "notpass", "num")}</tr></thead><tbody>`;
  if (!arr.length) h += `<tr><td colspan="8" class="empty">查無資料</td></tr>`;
  for (const p of arr) {
    h += `<tr>
      <td>${nameLink(p.name)}</td><td style="color:var(--muted)">${esc(p.emp_id)}</td>
      <td>${p.jobs.map(j => `<span class="job">${j}</span>`).join("")}</td>
      <td class="num">${p.total}</td><td class="num">${p.right}</td>
      <td class="num">${p.wrong ? `<span class="pill warn">${p.wrong}</span>` : "0"}</td>
      <td class="num"><span class="rate">${pct(p.rightRate)}</span>
        <span class="mini"><i style="width:${(p.rightRate*100).toFixed(0)}%"></i></span></td>
      <td class="num">${p.notpass ? `<span class="pill warn">${p.notpass}</span>` : "—"}</td>
    </tr>`;
  }
  h += `</tbody></table></div></div>`;
  return h;
}

// ---- 理貨成績（8月合併三題）分析 ----
const LIHUO_W = { 1: 40, 2: 30, 3: 30 };            // 各題配分（依 Q1/Q2/Q3 題序）
const lhBest = r => (r.best_score == null ? r.first_score : r.best_score);
const lihuoBase = () => ALL.filter(r => r.job_type === "理貨" && dateOK(r) && companyOK(r) && qOK(r));
function lihuoRows() {
  return lihuoBase().sort((a, b) => a.test_date.localeCompare(b.test_date)
    || (a.first_score - b.first_score) || a.name.localeCompare(b.name, "zh-Hant"));
}

// 子頁籤分派
function renderLihuo() {
  if (state.aview === "perq") return lihuoPerQ();
  if (state.aview === "company") return lihuoCompany();
  if (state.aview === "trend") return lihuoTrend();
  if (state.aview === "dist") return lihuoDist();
  return lihuoOverview();
}

// —— 成績總覽：統計卡 + 明細表 ——
function lihuoOverview() {
  const rows = lihuoRows();
  const n = rows.length;
  const perfect = rows.filter(r => r.first_score >= 100).length;
  const fixed = rows.filter(r => r.first_score < 100 && lhBest(r) >= 100).length;
  const still = rows.filter(r => lhBest(r) < 100).length;
  const avgFirst = n ? rows.reduce((a, r) => a + (r.first_score ?? 0), 0) / n : 0;
  let h = `<div class="tiles">
    <div class="tile"><div class="k">理貨測驗人次</div><div class="v">${n}</div></div>
    <div class="tile"><div class="k">首測平均分</div><div class="v" style="color:var(--brand)">${avgFirst.toFixed(1)}</div></div>
    <div class="tile"><div class="k">首測即滿分</div><div class="v" style="color:var(--brand)">${perfect} <small>／${n}</small></div></div>
    <div class="tile"><div class="k">靠補測達標</div><div class="v" style="color:var(--accent)">${fixed}</div></div>
    <div class="tile"><div class="k">仍未達滿分</div><div class="v" style="color:var(--warn)">${still}</div></div>
  </div>`;
  h += `<div class="tilenote">💡 八月起表單整併為<b>一份「理貨人員」三題</b>，三題合計滿分100（Q1配40、Q2配30、Q3配30）。<b>首測分數</b>＝當日最早一次；<b>補測後最高分</b>＝當天重測後的最高分。狀態：<b style="color:var(--brand)">綠</b>＝首測即滿分、<b style="color:var(--accent)">藍</b>＝首測未滿但補測後達標、<b style="color:var(--warn)">紅</b>＝仍未達滿分。點姓名看逐題詳情；上方分頁可看逐題弱點、公司對比、每日趨勢與分數分布。</div>`;
  h += `<div class="card"><h2>理貨人員成績（${n} 筆 · 首測分數＋補測後最高分）</h2><div class="tblwrap"><table><thead><tr>
    <th>姓名</th><th>工號</th><th>人力公司</th><th>日期</th><th class="num">首測分數</th><th class="num">補測後最高分</th><th class="num">作答次數</th><th>狀態</th>
  </tr></thead><tbody>`;
  if (!n) h += `<tr><td colspan="8" class="empty">此範圍內沒有理貨資料</td></tr>`;
  for (const r of rows) {
    const f = r.first_score, bs = lhBest(r);
    const status = f >= 100 ? `<span class="pill ok">首測滿分</span>`
      : (bs >= 100 ? `<span class="pill ok">補測後達標</span>`
                   : `<span class="pill warn">仍未達滿分</span>`);
    const fStyle = f >= 100 ? "font-weight:700" : "color:var(--warn);font-weight:800";
    const bShow = f >= 100
      ? `<span style="color:var(--muted)">（免補測）</span>`
      : (bs > f ? `<span style="color:var(--brand);font-weight:800">→ ${bs}分${bs >= 100 ? " ✓" : ""}</span>`
                : `<span style="color:var(--warn);font-weight:800">${bs}分（未再測）</span>`);
    h += `<tr>
      <td>${nameLink(r.name)}</td><td style="color:var(--muted)">${esc(r.emp_id)}</td>
      <td style="color:var(--muted);font-size:12px">${companyOf(r.emp_id)}</td>
      <td class="mdate">${d2(r.test_date)}</td>
      <td class="num"><span style="${fStyle}">${f}分</span></td>
      <td class="num">${bShow}</td>
      <td class="num">${r.submissions ?? "—"}</td>
      <td>${status}</td>
    </tr>`;
  }
  h += `</tbody></table></div></div>`;
  return h;
}

// —— 逐題弱點：依「題目內容」彙整（相同題目跨日合併），答錯率高者在上 ——
const lhNormQ = q => (q || "").replace(/^\s*\d+\s*[.．、,，)）]\s*/, "").trim();  // 去掉開頭題號（"3." / "3、" 等）
function lihuoPerQ() {
  const rows = lihuoBase();
  const map = new Map();
  for (const r of rows) for (const a of (Array.isArray(r.answers) ? r.answers : [])) {
    const key = lhNormQ(a.q);
    if (!key) continue;
    let m = map.get(key); if (!m) { m = { q: key, wrong: 0, total: 0, correct: "", pos: new Set() }; map.set(key, m); }
    m.total++; if (a.w) m.wrong++; else if (a.c && !m.correct) m.correct = a.c;
    if (a.n) m.pos.add(a.n);
  }
  const items = [...map.values()].map(m => {
    const ps = [...m.pos];
    const weight = ps.length === 1 ? LIHUO_W[ps[0]] : (ps.length ? ps.sort().map(p => LIHUO_W[p]).join("/") : "?");
    return { ...m, rate: m.total ? m.wrong / m.total : 0, weight };
  }).sort((a, b) => b.rate - a.rate || b.wrong - a.wrong || b.total - a.total);
  if (!items.length) return `<div class="card"><div class="empty" style="padding:30px">此範圍內沒有理貨作答資料</div></div>`;
  let h = `<div class="card"><h2>逐題弱點分析 <span class="h2note">依題目內容彙整（相同題目跨日合併計算），首測答錯率高者在上</span></h2><div style="padding:8px 16px 16px">`;
  items.forEach((it, i) => {
    const col = it.rate >= 0.15 ? "var(--warn)" : it.rate >= 0.05 ? "var(--accent)" : "var(--brand)";
    const w = Math.min(it.rate, 1) * 100;
    h += `<div style="margin:${i ? 14 : 4}px 0 0;padding:0 0 13px;border-bottom:1px solid var(--line)">
      <div style="color:var(--ink);font-weight:700;font-size:14px;margin-bottom:7px"><span class="rnk" style="margin-right:6px">${i + 1}</span>${esc(it.q)}</div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span class="pill mut">配分 ${it.weight}</span>
        <span class="achbar" style="width:150px"><i style="width:${w.toFixed(0)}%;background:${col}"></i></span>
        <b style="color:${col}">答錯率 ${pct(it.rate)}</b>
        <span style="color:var(--muted);font-size:12px">（首測答錯 ${it.wrong} / ${it.total} 人次）</span>
        ${it.correct ? `<span style="color:var(--muted);font-size:12px">正解：<span style="color:var(--brand);font-weight:700">${esc(it.correct)}</span></span>` : ""}
      </div></div>`;
  });
  h += `</div></div>`;
  return h;
}

// —— 人力公司對比 ——
function lihuoCompany() {
  const rows = lihuoBase();
  const ORD = ["信林", "有根", "丞閎", "新竹物流正職", "其他"];
  const map = new Map();
  for (const r of rows) {
    const c = companyOf(r.emp_id);
    let m = map.get(c); if (!m) { m = { c, n: 0, names: new Set(), sumFirst: 0, perfect: 0, pass: 0, still: 0 }; map.set(c, m); }
    m.n++; m.names.add(r.name); m.sumFirst += (r.first_score ?? 0);
    if (r.first_score >= 100) m.perfect++;
    if (lhBest(r) >= 100) m.pass++; else m.still++;
  }
  const arr = [...map.values()].map(m => ({ ...m, people: m.names.size, avg: m.n ? m.sumFirst / m.n : 0,
    perfectRate: m.n ? m.perfect / m.n : 0, passRate: m.n ? m.pass / m.n : 0 }))
    .sort((a, b) => (ORD.indexOf(a.c) + 9) % 100 - (ORD.indexOf(b.c) + 9) % 100);
  if (!arr.length) return `<div class="card"><div class="empty" style="padding:30px">此範圍內沒有理貨資料</div></div>`;
  let h = `<div class="card"><h2>人力公司對比 <span class="h2note">各公司首測平均分、達標率與待追蹤人數</span></h2><div class="tblwrap"><table class="bl"><thead><tr>
    <th>人力公司</th><th>受測人次</th><th>受測人數</th><th>首測平均分</th><th>首測滿分率</th><th style="text-align:left">達標率(補測後)</th><th>仍未達滿分</th>
  </tr></thead><tbody>`;
  for (const m of arr) {
    const col = m.passRate >= 0.95 ? "var(--brand)" : m.passRate >= 0.8 ? "var(--accent)" : "var(--warn)";
    h += `<tr class="jobrow"><td>${m.c}</td><td>${m.n}</td><td>${m.people}</td>
      <td>${m.avg.toFixed(1)}</td><td>${pct(m.perfectRate)}</td>
      <td style="text-align:left"><span class="achbar"><i style="width:${(m.passRate*100).toFixed(0)}%;background:${col}"></i></span><b style="color:${col}">${pct(m.passRate)}</b></td>
      <td>${m.still ? `<span class="pill warn">${m.still}</span>` : "0"}</td></tr>`;
  }
  const T = arr.reduce((o, m) => { o.n += m.n; o.perfect += m.perfect; o.pass += m.pass; o.still += m.still; o.sumFirst += m.sumFirst; m.names.forEach(x => o.names.add(x)); return o; }, { n: 0, perfect: 0, pass: 0, still: 0, sumFirst: 0, names: new Set() });
  h += `<tr style="border-top:2px solid var(--line)"><td style="font-weight:800">合計</td><td>${T.n}</td><td>${T.names.size}</td>
    <td>${T.n ? (T.sumFirst / T.n).toFixed(1) : "0"}</td><td>${T.n ? pct(T.perfect / T.n) : "0%"}</td>
    <td style="text-align:left"><b>${T.n ? pct(T.pass / T.n) : "0%"}</b></td><td>${T.still || 0}</td></tr>`;
  h += `</tbody></table></div>
    <div class="rank-no">※「受測人次」含同一人多日重複；「受測人數」為不重複姓名。人力公司依工號開頭：10＝有根、20＝丞閎、30＝信林、00＝新竹物流正職。</div></div>`;
  return h;
}

// —— 每日趨勢 ——
function lihuoTrend() {
  const rows = lihuoBase();
  const map = new Map();
  for (const r of rows) {
    let d = map.get(r.test_date); if (!d) { d = { date: r.test_date, n: 0, sumFirst: 0, perfect: 0, pass: 0 }; map.set(r.test_date, d); }
    d.n++; d.sumFirst += (r.first_score ?? 0); if (r.first_score >= 100) d.perfect++; if (lhBest(r) >= 100) d.pass++;
  }
  const arr = [...map.values()].sort((a, b) => a.date.localeCompare(b.date))
    .map(d => ({ ...d, avg: d.n ? d.sumFirst / d.n : 0, perfectRate: d.n ? d.perfect / d.n : 0, passRate: d.n ? d.pass / d.n : 0 }));
  if (!arr.length) return `<div class="card"><div class="empty" style="padding:30px">此範圍內沒有理貨資料</div></div>`;
  const bars = arr.map(d => {
    const col = d.avg >= 95 ? "var(--brand2)" : d.avg >= 80 ? "var(--accent)" : "var(--warn)";
    const mm = +d.date.slice(5, 7), dd = +d.date.slice(8, 10);
    return `<div class="cbar" title="${d.date}　首測平均 ${d.avg.toFixed(1)} 分／首測滿分率 ${pct(d.perfectRate)}（${d.n} 人次）">
      <div class="cbar-track"><i style="height:${Math.round(d.avg)}%;background:${col}"></i></div>
      <div class="cbar-val">${d.avg.toFixed(0)}</div><div class="cbar-x">${mm}/${dd}</div></div>`;
  }).join("");
  let h = `<div class="card"><h2>📈 每日首測平均分 <span class="h2note">柱高＝當日首測平均分（0–100）；綠≥95、藍≥80、紅<80</span></h2><div class="chart">${bars}</div></div>`;
  h += `<div class="card"><h2>逐日理貨成效</h2><div class="tblwrap"><table><thead><tr>
    <th>日期</th><th class="num">受測人次</th><th class="num">首測平均分</th><th class="num">首測滿分率</th><th class="num">達標率(補測後)</th></tr></thead><tbody>`;
  for (const d of arr) {
    h += `<tr><td>${esc(d.date)}</td><td class="num">${d.n}</td><td class="num">${d.avg.toFixed(1)}</td>
      <td class="num"><span class="rate">${pct(d.perfectRate)}</span> <span class="mini"><i style="width:${(d.perfectRate*100).toFixed(0)}%"></i></span></td>
      <td class="num"><span class="rate">${pct(d.passRate)}</span></td></tr>`;
  }

// —— 分數分布 + 待追蹤名單 ——
function lihuoDist() {
  const rows = lihuoBase();
  if (!rows.length) return `<div class="card"><div class="empty" style="padding:30px">此範圍內沒有理貨資料</div></div>`;
  const bucket = new Map();
  for (const r of rows) bucket.set(r.first_score, (bucket.get(r.first_score) || 0) + 1);
  const scores = [...bucket.keys()].sort((a, b) => b - a);
  const maxN = Math.max(...bucket.values());
  let h = `<div class="card"><h2>首測分數分布 <span class="h2note">共 ${rows.length} 人次；綠＝滿分、藍＝70+、紅＜70</span></h2><div style="padding:12px 16px 16px">`;
  for (const sc of scores) {
    const cnt = bucket.get(sc), w = maxN ? cnt / maxN * 100 : 0;
    const col = sc >= 100 ? "var(--brand)" : sc >= 70 ? "var(--accent)" : "var(--warn)";
    h += `<div style="display:flex;align-items:center;gap:10px;margin:8px 0">
      <b style="width:48px;text-align:right;color:${col}">${sc}分</b>
      <span style="flex:1;background:var(--chip);border-radius:6px;overflow:hidden;height:20px;min-width:110px">
        <i style="display:block;height:100%;width:${w.toFixed(0)}%;background:${col};border-radius:6px"></i></span>
      <span style="width:104px;color:var(--muted);font-size:12px">${cnt} 人次（${pct(cnt / rows.length)}）</span></div>`;
  }
  h += `</div></div>`;
  const pending = rows.filter(r => lhBest(r) < 100)
    .sort((a, b) => lhBest(a) - lhBest(b) || a.test_date.localeCompare(b.test_date) || a.name.localeCompare(b.name, "zh-Hant"));
  h += `<div class="card"><h2>🔴 待追蹤名單 <span class="h2note">補測後最高分仍未達滿分，需優先教導複測（${pending.length} 人次）</span></h2>`;
  if (!pending.length) { h += `<div class="empty" style="padding:24px">此範圍內全員已達滿分 🎉</div></div>`; return h; }
  h += `<div class="tblwrap"><table><thead><tr>
    <th>姓名</th><th>工號</th><th>人力公司</th><th>日期</th><th class="num">首測</th><th class="num">最高分</th><th>首測答錯題</th></tr></thead><tbody>`;
  for (const r of pending) {
    const wrongQs = (Array.isArray(r.answers) ? r.answers : []).filter(a => a.w).map(a => "Q" + a.n).join("、");
    h += `<tr>
      <td>${nameLink(r.name)}</td><td style="color:var(--muted)">${esc(r.emp_id)}</td>
      <td style="color:var(--muted);font-size:12px">${companyOf(r.emp_id)}</td>
      <td class="mdate">${d2(r.test_date)}</td>
      <td class="num"><span style="color:var(--warn);font-weight:800">${r.first_score}</span></td>
      <td class="num"><b>${lhBest(r)}</b></td>
      <td style="color:var(--warn);font-size:12px">${wrongQs || "—"}</td></tr>`;
  }
  h += `</tbody></table></div></div>`;
  return h;
}

const LIHUO_QT = { 1: "小型轎車輪胎直徑54cm，該如何處理？", 2: "貨櫃內有空棧板，應反應現場主管並清空", 3: "跨越輸送帶，請利用有安裝黃色跨越板處跨越" };
function rankData() {
  const map = new Map();
  const noq = {}; // 無題幹（是非題未抓到題幹）的答錯數，依工種
  const lcorrect = {}; // 理貨每題正解（由答對者反推，免寫死）
  for (const r of ALL) {
    if (!jobOK(r)) continue;
    if (!companyOK(r)) continue;
    if (!dateOK(r)) continue;
    if (r.job_type === "理貨") {   // 8月合併：題目每天不同，依題目文字 a.q 分組（同題跨日合併、不同題分開）
      const ans = Array.isArray(r.answers) ? r.answers : [];
      for (const a of ans) {
        const qt = a.q || LIHUO_QT[a.n] || ("Q" + a.n);
        if (!a.w && a.c && lcorrect[qt] == null) lcorrect[qt] = a.c;
        const key = "理貨|" + qt;
        let m = map.get(key);
        if (!m) { m = { job: "理貨", q: qt, attempts: 0, wrong: 0, correct: "", dates: new Set() }; map.set(key, m); }
        m.attempts++; if (a.w) m.wrong++; m.dates.add(r.test_date);
      }
      continue;
    }
    if (!r.question) { if (r.is_wrong) noq[r.job_type] = (noq[r.job_type] || 0) + 1; continue; }
    const key = r.job_type + "" + r.question;
    let m = map.get(key);
    if (!m) { m = { job: r.job_type, q: r.question, attempts: 0, wrong: 0, correct: "", dates: new Set() }; map.set(key, m); }
    m.attempts++; if (r.is_wrong) m.wrong++; m.dates.add(r.test_date);
    if (!m.correct && r.correct_option) m.correct = r.correct_option;
  }
  for (const m of map.values()) if (m.job === "理貨" && !m.correct && lcorrect[m.q]) m.correct = lcorrect[m.q];
  let arr = [...map.values()].map(m => ({ ...m, pct: m.attempts ? m.wrong / m.attempts : 0, dates: [...m.dates].sort() }))
    .filter(m => m.wrong > 0)
    .sort((a, b) => b.wrong - a.wrong || b.pct - a.pct || a.job.localeCompare(b.job));
  return { arr, noq };
}

    }

    h += `<div class="card"><h2><span class="job">${state.job}</span> 常錯題（${arr.length} 題有答錯 · 複測題庫）</h2>${tableFor(arr)}</div>`;
  }
  const noqTotal = Object.values(noq).reduce((a, b) => a + b, 0);
  if (noqTotal > 0) h += `<div class="card"><div class="rank-no" style="border-top:0">※ 另有 ${noqTotal} 筆答錯屬「是非題未抓到題幹」（${Object.entries(noq).map(([j, n]) => j + " " + n).join("、")}），無法對應到單一題目、未列入排行；日後表單改版把是非題題幹一併記錄即可納入。</div></div>`;
  return h;
}

// ---- 複測追蹤 ----
function retestData() {
  const map = new Map();
  for (const r of ALL) {
    if (!r.is_wrong) continue;
    if (!jobOK(r)) continue;
    if (!companyOK(r)) continue;
    if (!dateOK(r)) continue;
    if (!qOK(r)) continue;
    let p = map.get(r.name);
    if (!p) { p = { name: r.name, emp_id: r.emp_id, jobs: new Set(), items: [], corrected: 0, notpass: 0 }; map.set(r.name, p); }
    p.jobs.add(r.job_type); p.items.push(r);
    if (r.passed) p.corrected++; else p.notpass++;
    if (!p.emp_id && r.emp_id) p.emp_id = r.emp_id;
  }
  const arr = [...map.values()].map(p => ({ ...p, jobs: [...p.jobs], wrong: p.items.length }));
  arr.sort((a, b) => b.notpass - a.notpass || b.wrong - a.wrong || a.name.localeCompare(b.name, "zh-Hant"));
  return arr;
}

  const QN = { 1: "Q1 輪胎54cm", 2: "Q2 空棧板", 3: "Q3 跨越板" };

      b += `<tr>

        <td>${badge}</td><td class="num">${r.submissions ?? "—"}</td>
        <td class="rank-q" colspan="3">${qcell}</td>
      </tr>`;
      continue;

      ? (r.passed ? '<span class="pill ok">答錯·已補正</span>' : '<span class="pill warn">答錯·未通過</span>')
      : '<span class="pill ok">答對</span>';

function csvCell(v) { v = (v ?? "").toString(); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function download(name, rows) {
  const csv = "﻿" + rows.map(r => r.map(csvCell).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}

  } else if (state.view === "lihuo") {
    const rows = [["姓名", "工號", "人力公司", "日期", "首測分數", "補測後最高分", "作答次數", "狀態"]];
    for (const r of lihuoRows()) {
      const bs = (r.best_score == null ? r.first_score : r.best_score);
      const st = r.first_score >= 100 ? "首測滿分" : (bs >= 100 ? "補測後達標" : "仍未達滿分");
      rows.push([r.name, r.emp_id, companyOf(r.emp_id), r.test_date, r.first_score, bs, r.submissions ?? "", st]);
    }
    download(`理貨成績_${tag}.csv`, rows);
  } else if (state.view === "wrong") {
    const rows = [["姓名", "工號", "工種", "日期", "狀態", "題目", "你的答案", "正解"]];
    for (const p of wrongData()) for (const r of p.items)
      rows.push([p.name, p.emp_id, r.job_type, r.test_date, r.passed ? "已補正" : "未通過", r.question || "（是非題）", r.chosen_option, r.correct_option]);
    download(`錯題統整_${tag}.csv`, rows);
  } else if (state.view === "rank") {
    const rows = [["工種", "名次", "題目", "答錯", "答錯率", "應答", "出現日期", "正解"]];
    const { arr } = rankData();
    const byJob = {}; arr.forEach(m => (byJob[m.job] ||= []).push(m));
    for (const j of Object.keys(byJob)) byJob[j].forEach((m, i) => rows.push([j, i + 1, m.q, m.wrong, pct(m.pct), m.attempts, m.dates.map(d2).join("、"), m.correct]));
    download(`常錯題排行_${tag}.csv`, rows);
  } else if (state.view === "retest") {
    const rows = [["姓名", "工號", "工種", "首測答錯", "已補正", "未補正", "複測結果", "教導簽名"]];
    for (const p of retestData()) rows.push([p.name, p.emp_id, p.jobs.join("/"), p.wrong, p.corrected, p.notpass, "待複測", ""]);
    download(`複測追蹤名冊_${tag}.csv`, rows);
  } else {
    const rows = [["日期", "工種", "受測", "首測答錯", "首測答對率"]];
    for (const d of dailyData()) rows.push([d.date, d.job, d.n, d.wrong, pct(d.n ? (d.n - d.wrong) / d.n : 0)]);
    download(`逐日總覽_${tag}.csv`, rows);
  }
}

function bind() {
  document.querySelectorAll("#modeSeg button").forEach(b => b.onclick = () => {
    state.mode = b.dataset.mode; state.q = ""; state.company = "全部"; resetRange(); render();
  });
  document.querySelectorAll("#jobSeg button").forEach(b => b.onclick = () => { state.job = b.dataset.job; render(); });
  document.querySelectorAll("#viewSeg button").forEach(b => b.onclick = () => { state.view = b.dataset.view; render(); });
  document.querySelectorAll("#aviewSeg button").forEach(b => b.onclick = () => { state.aview = b.dataset.aview; render(); });
  document.querySelectorAll(".nameL").forEach(el => el.onclick = () => openPerson(el.dataset.person));
  const q = document.getElementById("q");
  if (q) {
    let composing = false;
    const applySearch = () => {
      const pos = q.selectionStart; state.q = q.value; render();
      const nq = document.getElementById("q");
      if (nq) { nq.focus(); try { nq.setSelectionRange(pos, pos); } catch (_) {} }
    };
    q.addEventListener("compositionstart", () => { composing = true; });
    q.addEventListener("compositionend", () => { composing = false; applySearch(); });
    q.oninput = (e) => { if (composing || (e && e.isComposing)) { state.q = q.value; return; } applySearch(); };
  }
  const dFrom = document.getElementById("dFrom"), dTo = document.getElementById("dTo");
  if (dFrom) dFrom.onchange = () => { state.from = dFrom.value; if (state.to < state.from) state.to = state.from; render(); };
  if (dTo) dTo.onchange = () => { state.to = dTo.value; if (state.from > state.to) state.from = state.to; render(); };
  const ySel = document.getElementById("ySel");
  if (ySel) ySel.onchange = () => { state.year = ySel.value; state.month = "全部";
    const ds = modeDates().filter(d => state.year === "全部" || d.slice(0, 4) === state.year);
    state.from = ds[0]; state.to = ds[ds.length - 1]; render(); };
  const mSel = document.getElementById("mSel");
  if (mSel) mSel.onchange = () => { state.month = mSel.value;
    const ds = modeDates().filter(d => (state.year === "全部" || d.slice(0, 4) === state.year) && (state.month === "全部" || d.slice(5, 7) === state.month));
    state.from = ds[0]; state.to = ds[ds.length - 1]; render(); };
  const dReset = document.getElementById("dReset");
  if (dReset) dReset.onclick = () => { resetRange(); render(); };
  const compSel = document.getElementById("compSel");
  if (compSel) compSel.onchange = () => { state.company = compSel.value; render(); };
  document.querySelectorAll("th[data-sort]").forEach(th => th.onclick = () => {
    const k = th.dataset.sort;
    if (state.sortKey === k) state.sortDir *= -1; else { state.sortKey = k; state.sortDir = (k === "name" || k === "emp_id") ? 1 : -1; }
    render();
  });
}

(async () => {
  const app = document.getElementById("app");
  if (!TOKEN) { app.innerHTML = `<div class="empty">🔒 此連結缺少存取權杖，請使用主管收到的完整連結。</div>`; return; }
  try {
    const res = await fetch(`${FN_URL}?k=${encodeURIComponent(TOKEN)}`, { cache: "no-store" });
    if (res.status === 401) { app.innerHTML = `<div class="empty">🔒 存取權杖無效或已更換，請向管理者索取新連結。</div>`; return; }
    if (!res.ok) throw new Error("讀取失敗 " + res.status);
    const data = await res.json();
    ALL = Array.isArray(data.rows) ? data.rows : [];
    RETEST = Array.isArray(data.retest) ? data.retest : [];
    DATES = [...new Set(ALL.map(r => r.test_date))].sort();
    state.mode = ALL.some(r => r.job_type !== "理貨") ? "july" : "august";
    resetRange();
    render();
  }
  catch (e) { app.innerHTML = `<div class="empty">❌ ${esc(e.message)}</div>`; }
})();
</script>
