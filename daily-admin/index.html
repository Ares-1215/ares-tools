<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新竹物流 轉運中心安全教育訓練 · 每日測驗督導平台</title>
<style>
  :root{--bg:#f4f6f9;--card:#fff;--ink:#1a2330;--muted:#66738a;--line:#e3e8ef;
    --brand:#0b6b3a;--brand2:#12945a;--accent:#1565c0;--warn:#c62828;--warnbg:#fdecea;
    --okbg:#e8f5ec;--chip:#eef2f7;--shadow:0 1px 3px rgba(20,40,70,.08),0 6px 18px rgba(20,40,70,.05)}
  @media (prefers-color-scheme:dark){:root{--bg:#0f141b;--card:#161d27;--ink:#e6ebf2;--muted:#93a1b5;
    --line:#26313f;--brand:#38c07f;--brand2:#2ea36a;--accent:#5aa2e6;--warn:#ff6b6b;--warnbg:#3a1f22;
    --okbg:#183026;--chip:#1e2733;--shadow:0 1px 3px rgba(0,0,0,.4)}}
  :root[data-theme="dark"]{--bg:#0f141b;--card:#161d27;--ink:#e6ebf2;--muted:#93a1b5;--line:#26313f;
    --brand:#38c07f;--brand2:#2ea36a;--accent:#5aa2e6;--warn:#ff6b6b;--warnbg:#3a1f22;--okbg:#183026;--chip:#1e2733}
  :root[data-theme="light"]{--bg:#f4f6f9;--card:#fff;--ink:#1a2330;--muted:#66738a;--line:#e3e8ef;
    --brand:#0b6b3a;--brand2:#12945a;--accent:#1565c0;--warn:#c62828;--warnbg:#fdecea;--okbg:#e8f5ec;--chip:#eef2f7}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.55}
  .wrap{max-width:1400px;margin:0 auto;padding:16px 16px 60px}
  header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
  h1{margin:0 0 2px;line-height:1.22}
  h1 .brand{display:block;font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.4px;margin-bottom:3px}
  h1 .ttl{display:block;font-size:20px;font-weight:800;text-wrap:balance}
  .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  .toolbtns{display:flex;gap:8px;flex-wrap:wrap}
  .theme-btn{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:9px;padding:7px 10px;cursor:pointer;font-size:13px}
  .theme-btn:hover{color:var(--ink)}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .tabs button{border:0;background:var(--chip);color:var(--muted);padding:9px 16px;border-radius:10px;
    font-size:14px;font-weight:700;cursor:pointer}
  .tabs button.on{background:var(--brand);color:#fff}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
    padding:16px;margin-bottom:16px}
  .card.pad0{padding:0;overflow:hidden}
  .card h2{font-size:15px;margin:0;padding:13px 16px;border-bottom:1px solid var(--line);font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card h2 .h2note{font-weight:600;font-size:12px;color:var(--muted)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  input,select,textarea{background:var(--bg);border:1.5px solid var(--line);color:var(--ink);border-radius:9px;
    padding:9px 11px;font-size:14px}
  input[type=search]{flex:1;min-width:170px}
  button.act{border:0;background:var(--brand);color:#fff;border-radius:9px;padding:9px 15px;
    font-size:14px;font-weight:700;cursor:pointer}
  button.sec{background:var(--chip);color:var(--ink)}
  button.sec.rf{display:inline-flex;align-items:center;gap:6px}
  button.sec.rf .rfi{fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;
    color:var(--accent);transition:transform .55s cubic-bezier(.4,0,.2,1)}
  button.sec.rf:hover{border-color:var(--accent)}
  button.sec.rf:hover .rfi{transform:rotate(-180deg)}
  button.sec.rf.spin .rfi{animation:rfspin .7s linear infinite}
  @keyframes rfspin{to{transform:rotate(360deg)}}
  .seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
  .seg button{border:0;background:transparent;color:var(--muted);padding:7px 13px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
  .tile .k{font-size:12px;color:var(--muted);font-weight:600}
  .tile .v{font-size:24px;font-weight:800;margin-top:2px}
  .tile .v small{font-size:13px;color:var(--muted);font-weight:600}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{border-bottom:1px solid var(--line);padding:8px 9px;text-align:left;vertical-align:top;white-space:nowrap}
  th{background:var(--chip);position:sticky;top:0;color:var(--muted);font-size:12px;font-weight:700;user-select:none}
  th.sortable{cursor:pointer} th.num,td.num{text-align:right}
  tbody tr:hover{background:var(--chip)}
  .tblwrap{overflow-x:auto;max-height:72vh}
  .pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;font-weight:700}
  .pill.ok,.pass{background:var(--okbg);color:var(--brand)} .pill.warn,.fail{background:var(--warnbg);color:var(--warn)}
  .pill.mut{background:var(--chip);color:var(--muted)}
  .muted{color:var(--muted)} .warn{color:var(--warn)} .ok{color:var(--brand)}
  .rate{font-weight:800}
  .mini{height:6px;background:var(--chip);border-radius:4px;overflow:hidden;min-width:64px;display:inline-block;vertical-align:middle}
  .mini>i{display:block;height:100%;background:var(--brand2)}
  .job{font-size:11px;font-weight:800;padding:1px 7px;border-radius:6px;background:var(--chip);color:var(--muted);margin-right:3px}
  .nameL{color:var(--accent);font-weight:700;cursor:pointer;border-bottom:1px dotted var(--accent)}
  .nameL:hover{opacity:.75}
  .msg{border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
  .msg.warn{background:var(--warnbg);color:var(--warn)} .msg.ok{background:var(--okbg);color:var(--brand)}
  .empty{padding:30px;text-align:center;color:var(--muted)}
  details summary{cursor:pointer;color:var(--accent);font-size:12px}
  .ans{font-size:12px;margin-top:4px}
  .ans .w{color:var(--warn)} .ans .r{color:var(--brand)}
  code{background:var(--chip);padding:1px 5px;border-radius:5px}
  /* 錯題統整 */
  .wperson{border-bottom:1px solid var(--line);padding:12px 16px}
  .wperson:last-child{border-bottom:0}
  .wname{font-weight:800;font-size:14px;margin-bottom:7px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .wname .cnt{background:var(--warnbg);color:var(--warn);border-radius:999px;font-size:11px;padding:1px 8px;font-weight:800}
  .wq{font-size:12.5px;color:var(--muted);padding:6px 0;border-top:1px dashed var(--line);display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:start}
  .wq .qt{color:var(--ink)} .wq .x{color:var(--warn);font-weight:700} .wq .o{color:var(--brand);font-weight:700}
  .rank-q{white-space:normal;min-width:200px;max-width:420px;color:var(--ink)}
  .rank-c{white-space:normal;min-width:110px;max-width:200px;color:var(--brand);font-weight:700}
  .rnk{display:inline-block;min-width:24px;text-align:center;font-weight:800;color:var(--warn)}
  .rank-no{padding:11px 16px;color:var(--muted);font-size:12px;line-height:1.7}
  /* 圖表（純 CSS） */
  .chart{display:flex;align-items:flex-end;gap:7px;padding:16px 16px 34px;overflow-x:auto;min-height:180px}
  .cbar{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:26px}
  .cbar-track{height:120px;width:22px;background:var(--chip);border-radius:5px;display:flex;align-items:flex-end;overflow:hidden}
  .cbar-track>i{display:block;width:100%;border-radius:5px 5px 0 0;transition:height .3s}
  .cbar-val{font-size:10.5px;font-weight:800;color:var(--muted)}
  .cbar-x{font-size:10.5px;color:var(--muted);white-space:nowrap;transform:rotate(-45deg);transform-origin:center top;margin-top:5px}
  /* 數據分析 */
  .asel{display:flex;gap:8px;align-items:center;padding:10px 16px 2px;flex-wrap:wrap}
  .aline{width:100%;height:auto;display:block}
  .aline .grid{stroke:var(--line);opacity:.55} .aline text{fill:var(--muted);font-size:10px}
  .gbar{display:grid;grid-template-columns:116px 1fr auto;gap:10px;align-items:center;padding:6px 16px;font-size:12.5px}
  .gbar .gk{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gbar .gt{height:15px;background:var(--chip);border-radius:8px;overflow:hidden}
  .gbar .gt>i{display:block;height:100%;border-radius:8px;transition:width .4s}
  .gbar .gv{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
  .gbar .gv .gsub{color:var(--muted);font-weight:600;font-size:11px}
  .donutwrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap;padding:16px}
  .dleg{display:flex;flex-direction:column;gap:6px;font-size:13px}
  .dleg .dl{display:flex;align-items:center;gap:7px}
  .dleg .dot{width:11px;height:11px;border-radius:3px;display:inline-block}
  .aband{display:flex;height:22px;border-radius:8px;overflow:hidden;margin:10px 16px 4px}
  .aband>span{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;min-width:0}
  .abandkey{padding:0 16px 12px;font-size:11px;color:var(--muted)}
  .abandkey b{color:var(--ink)}
  /* Modal 個人詳情 */
  .modal{position:fixed;inset:0;background:rgba(10,18,30,.55);display:flex;align-items:flex-start;justify-content:center;padding:28px 14px;z-index:50;overflow-y:auto}
  .mbox{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.35);max-width:820px;width:100%;overflow:hidden}
  .mhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
  .mhead .mt{font-size:17px;font-weight:800;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
  .mhead .ms{color:var(--muted);font-size:12.5px;margin-top:4px}
  .mclose{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:9px;padding:5px 11px;cursor:pointer;font-size:16px;line-height:1}
  .mstat{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px 4px}
  .mstat .ms1{background:var(--chip);border-radius:10px;padding:7px 12px;font-size:12px;color:var(--muted);font-weight:600}
  .mstat .ms1 b{color:var(--ink);font-size:15px;font-weight:800}
  .mbody{padding:8px 18px 18px}
  .hide{display:none}
  /* ── 手機版排版（≤640px）：分頁、工具列、分段切換、篩選器改為整齊成列 ── */
  @media (max-width:640px){
    .wrap{padding:14px 12px 48px}
    h1 .ttl{font-size:16px}
    h1 .brand{font-size:11.5px}
    .sub{font-size:12.5px}
    .toolbtns{width:100%}
    .toolbtns .theme-btn{flex:1 1 auto;text-align:center}
    .tabs button{flex:1 1 auto;text-align:center;padding:9px 8px}
    .tiles{grid-template-columns:repeat(2,1fr)}
    .bar,.row{gap:6px}
    .seg{display:flex;width:100%}
    .seg button{flex:1 1 auto;text-align:center;padding:8px 6px}
    .bar input[type=search],.row input[type=search]{flex:1 1 100%;min-width:0}
    .bar select{flex:1 1 100%;min-width:0}
    .row select{flex:1 1 auto;min-width:0}
    .bar .muted{display:block;width:100%;margin:8px 0 -2px 0!important}
    .bar button.sec,.bar button.act{flex:1 1 100%}
    .row button.act,.row button.sec{flex:1 1 auto}
    .modal{padding:14px 8px}
    .mstat{padding:10px 14px 2px}
    .mbody{padding:6px 12px 14px}
  }
  @media print{
    body{background:#fff}
    .wrap{max-width:none;padding:0}
    .noprint{display:none !important}
    .card,.tile{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
    th{position:static}
    .modal{position:static;background:none;padding:0}.mbox{box-shadow:none;border:0}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1><span class="brand">🛡️ 新竹物流 · 轉運中心</span><span class="ttl">人員安全教育訓練 · 每日測驗督導平台</span></h1>
      <div class="sub">拆櫃・拉線・疊櫃 每日三題　·　成績・截止・題庫・權限一站管理</div>
    </div>
    <div class="toolbtns noprint" style="display:none">
      <button class="theme-btn" id="csvBtn">⬇ 匯出 CSV</button>
      <button class="theme-btn" id="printBtn">🖨 列印</button>
      <button class="theme-btn" id="themeBtn">🌓 主題</button>
    </div>
  </header>
  <div class="tabs noprint" id="tabs" style="display:none">
    <button data-t="board" class="on">📊 成績看板</button>
    <button data-t="ext">⏰ 延後審核</button>
    <button data-t="bank">📚 題庫管理</button>
    <button data-t="center">🏢 中心管理</button>
    <button data-t="perm" id="permTab" style="display:none">🔑 權限管理</button>
  </div>
  <div id="userbar" class="noprint" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;margin:-4px 0 12px"></div>
  <div id="view"><div class="card">載入中…</div></div>
</div>

<div id="modal" class="modal hide"><div class="mbox" id="mbox"></div></div>

<script>
const API = "https://hmqnlovyzlvvnkqmfwtt.supabase.co/functions/v1/daily";
const K = new URLSearchParams(location.search).get("k") || "";
const view = document.getElementById("view");
const esc = s => (s ?? "").toString().replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const pct = x => (x*100).toFixed(1)+"%";
const d2 = s => (s||"").slice(5); // MM-DD
// todayStr＝日曆日(00:00 換)：看板「今日」用。bizToday＝業務日(每天 08:00 換題/歸戶)：延後審核截止用，與後端一致。
const todayStr = () => new Date(Date.now()+8*3600000).toISOString().slice(0,10);
const bizToday = () => new Date(Date.now()+8*3600000-8*3600000).toISOString().slice(0,10);
function fmtTime(shiftMs){ return new Date(shiftMs).toISOString().slice(11,16); }
function fmtDT(shiftMs){ const iso=new Date(shiftMs).toISOString(); return iso.slice(5,7)+"/"+iso.slice(8,10)+" "+iso.slice(11,16); }

// ---- 登入 / 權限 ----
let SESS = localStorage.getItem("dadm_sess") || "";
let ME = { emp:"", name:"", is_super:false, active:false };
const canEdit = () => ME.active || ME.is_super;

async function api(action, opts={}){
  const isPost = !!opts.body;
  const q = opts.query ? "&"+opts.query : "";
  const s = SESS ? "&sess="+encodeURIComponent(SESS) : "";
  const res = await fetch(`${API}?action=${action}&k=${encodeURIComponent(K)}${s}${q}`, {
    method:isPost?"POST":"GET", headers:isPost?{"Content-Type":"application/json"}:{},
    body:isPost?JSON.stringify(opts.body):undefined });
  return res.json();
}

// ---- 公司對照 ----
const COMP_ORDER = ["信林","有根","丞閎","新竹物流","其他"];
function companyOf(emp){ emp=String(emp||"").trim(); if(emp.length>8) return "其他"; const p=emp.slice(0,2);
  return p==="10"?"有根":p==="20"?"丞閎":p==="30"?"信林":p==="00"?"新竹物流":"其他"; }

// ---- 主題 / 列印 / CSV ----
document.getElementById("themeBtn").onclick = () => {
  const r = document.documentElement;
  const cur = r.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light");
  r.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
};
document.getElementById("printBtn").onclick = () => window.print();
document.getElementById("csvBtn").onclick = () => { if(curTab==="board") exportCsv(); else alert("請切到「成績看板」再匯出。"); };

// ---- 分頁 ----
let curTab = "board";
document.querySelectorAll(".tabs button").forEach(b=>{
  b.onclick = ()=>{ document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); curTab=b.dataset.t; TAB[curTab](); };
});
const TAB = { board: renderBoard, ext: renderExt, bank: renderBank, center: renderCenter, perm: renderPerm };

// ---- 登入畫面 / 使用者列 / 權限鎖 ----
function hideChrome(){ document.getElementById("tabs").style.display="none";
  document.querySelector(".toolbtns").style.display="none"; document.getElementById("userbar").innerHTML=""; }
function showChrome(){ document.getElementById("tabs").style.display=""; document.querySelector(".toolbtns").style.display="flex"; }
function setMe(me){ ME={ emp:me.emp_id, name:me.name||"", is_super:!!me.is_super, active:!!me.active };
  const pt=document.getElementById("permTab"); if(pt) pt.style.display = ME.is_super?"":"none"; renderUserBar(); }
function renderUserBar(){
  const el=document.getElementById("userbar"); if(!el) return;
  const badge = ME.is_super?'<span class="pill ok">最高權限</span>':(ME.active?'<span class="pill ok">可操作</span>':'<span class="pill mut">僅檢視</span>');
  el.innerHTML = `<span class="muted">👤 ${esc(ME.name||"")}（${esc(ME.emp)}）</span> ${badge}
    <button class="theme-btn" id="logoutBtn" style="margin-left:auto">登出</button>`;
  document.getElementById("logoutBtn").onclick=()=>{ SESS=""; localStorage.removeItem("dadm_sess");
    ME={emp:"",name:"",is_super:false,active:false}; RANGE_LOADED=false; renderLogin(); };
}
async function boot(){
  if(SESS){ const me=await api("admin_me"); if(me&&me.ok){ setMe(me); return afterLogin(); }
    SESS=""; localStorage.removeItem("dadm_sess"); }
  renderLogin();
}
function afterLogin(){ showChrome(); curTab="board";
  document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on", x.dataset.t==="board"));
  renderBoard(); }
function renderLogin(){
  hideChrome();
  view.innerHTML = `<div class="card" style="max-width:380px;margin:36px auto">
    <b style="font-size:17px">🔐 管理人員承辦看板登入</b>
    <div class="sub" style="margin:4px 0 12px">請輸入工號與密碼</div>
    <label style="font-size:13px;font-weight:700;display:block;margin-bottom:4px">工號</label>
    <input id="li_emp" inputmode="numeric" placeholder="工號" style="width:100%;margin-bottom:10px">
    <label style="font-size:13px;font-weight:700;display:block;margin-bottom:4px">密碼</label>
    <input id="li_pwd" type="password" placeholder="密碼（預設為工號）" style="width:100%;margin-bottom:12px">
    <button class="act" id="li_go" style="width:100%">登入</button>
    <div id="li_msg"></div>
    <div class="muted" style="font-size:12px;margin-top:10px">預設密碼為您的工號。登入後可檢視各功能；延後審核／題庫／中心／刪除紀錄需經陳尚福（26516）開通權限。</div>
  </div>`;
  const go = async ()=>{
    const emp=document.getElementById("li_emp").value.trim(), pwd=document.getElementById("li_pwd").value;
    if(!emp){ limsg("請輸入工號",false); return; }
    const r = await api("admin_login", { body:{ emp_id:emp, pwd } });
    if(!r||!r.ok){ limsg({bad_emp:"工號格式不符",bad_pwd:"密碼錯誤"}[r&&r.reason]||"登入失敗",false); return; }
    SESS=r.sess; localStorage.setItem("dadm_sess",SESS); setMe(r); afterLogin();
  };
  document.getElementById("li_go").onclick = go;
  document.getElementById("li_pwd").addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
  function limsg(t,ok){ document.getElementById("li_msg").innerHTML=`<div class="msg ${ok?'ok':'warn'}">${esc(t)}</div>`; }
}
// 權限鎖：非可操作者，將寫入類按鈕/欄位停用
function lockNote(){ return canEdit()?"":`<div class="msg warn">🔒 你目前為「僅檢視」權限，無法在此操作。請洽陳尚福（工號 26516）開通。</div>`; }
function applyLock(){ if(canEdit()) return;
  view.querySelectorAll("button.act, #bk .sv, #clist .dis, #plist button").forEach(b=>{ b.disabled=true; b.style.opacity=".5"; b.style.cursor="not-allowed"; });
  view.querySelectorAll("input, select, textarea").forEach(el=>{ el.disabled=true; }); }

/* ==========================================================
   成績看板（比照 score-live 分析）
   ========================================================== */
let RESULTS = [];   // daily_results 原始（跨日）
let FLAT = [];      // 逐題攤平：{name,emp_id,job_type,test_date,question,chosen_option,correct_option,is_wrong,center,duration_sec,created_at,daypass}
let DATES = [];
let RANGE_LOADED = false;
let bs = { view:"board", job:"全部", q:"", company:"全部", center:"全部", unit:"全部", from:"", to:"", year:"全部", month:"全部",
  boardDate: todayStr(), sortKey:"wrongRate", sortDir:-1,
  // 數據分析：兩面板各自獨立的 中心/單位/公司 篩選
  gCenter:"全部", gUnit:"全部", gCompany:"全部", pCenter:"全部", pUnit:"全部", pCompany:"全部" };

async function loadRange(){
  const r = await api("results_range");
  RESULTS = r.rows || [];
  FLAT = [];
  for(const res of RESULTS){
    const daypass = res.total>0 && res.score===res.total;
    for(const a of (res.answers||[])){
      FLAT.push({ name:res.name, emp_id:res.emp_id, job_type:a.job_type, test_date:res.test_date,
        question:a.question, chosen_option:a.chosen, correct_option:a.correct, is_wrong:!a.ok,
        center:res.center, unit:res.unit, duration_sec:res.duration_sec, created_at:res.created_at, daypass });
    }
  }
  DATES = [...new Set(RESULTS.map(r=>r.test_date))].sort();
  if(!DATES.length) DATES=[todayStr()];
  if(!bs.from || !DATES.includes(bs.from)) bs.from = DATES[0];
  if(!bs.to || !DATES.includes(bs.to)) bs.to = DATES[DATES.length-1];
  RANGE_LOADED = true;
}

async function renderBoard(){
  view.innerHTML = `<div class="card"><div class="empty">載入中…</div></div>`;
  if(!RANGE_LOADED) await loadRange();
  draw();
}

// 篩選器（分析視圖用）
const dateOK = r => (!bs.from || r.test_date>=bs.from) && (!bs.to || r.test_date<=bs.to);
const jobOK  = r => bs.job==="全部" || r.job_type===bs.job;
const compOK = r => bs.company==="全部" || companyOf(r.emp_id)===bs.company;
const centerOK = r => bs.center==="全部" || (r.center||"")===bs.center;
const unitOK = r => bs.unit==="全部" || (r.unit||"")===bs.unit;
const qOK    = r => { if(!bs.q) return true; const q=bs.q.trim(); return (r.name||"").includes(q) || (r.emp_id||"").includes(q); };
const flatScoped = () => FLAT.filter(r => jobOK(r) && dateOK(r) && compOK(r) && centerOK(r) && unitOK(r));
// 當日明細用：依當日 + 中心 + 單位 + 公司 篩 RESULTS
const boardRows = () => RESULTS.filter(r => r.test_date===bs.boardDate
  && (bs.center==="全部" || (r.center||"")===bs.center)
  && (bs.unit==="全部" || (r.unit||"")===bs.unit)
  && (bs.company==="全部" || companyOf(r.emp_id)===bs.company));

function draw(){
  const compsPresent = ["全部", ...COMP_ORDER.filter(c=>RESULTS.some(r=>companyOf(r.emp_id)===c))];
  const compOpts = compsPresent.map(c=>`<option value="${c}" ${c===bs.company?"selected":""}>${c}</option>`).join("");
  const centersPresent = ["全部", ...[...new Set(RESULTS.map(r=>r.center).filter(Boolean))].sort()];
  if(!centersPresent.includes(bs.center)) bs.center="全部";
  const centerOpts = centersPresent.map(c=>`<option value="${esc(c)}" ${c===bs.center?"selected":""}>${c==="全部"?"全部中心":esc(c)}</option>`).join("");
  const UNIT_ORDER = ["發送單位","到著單位"];
  const unitsPresent = ["全部", ...UNIT_ORDER, ...[...new Set(RESULTS.map(r=>r.unit).filter(u=>u&&!UNIT_ORDER.includes(u)))].sort()];
  if(!unitsPresent.includes(bs.unit)) bs.unit="全部";
  const unitOpts = unitsPresent.map(u=>`<option value="${esc(u)}" ${u===bs.unit?"selected":""}>${u==="全部"?"全部單位":esc(u)}</option>`).join("");
  const scoped = DATES.filter(d=>(bs.year==="全部"||d.slice(0,4)===bs.year)&&(bs.month==="全部"||d.slice(5,7)===bs.month));
  const dopt = sel => scoped.map(d=>`<option value="${d}" ${d===sel?"selected":""}>${d.slice(5)}</option>`).join("");
  const years = ["全部", ...[...new Set(DATES.map(d=>d.slice(0,4)))].sort()];
  const yearOpts = years.map(y=>`<option value="${y}" ${y===bs.year?"selected":""}>${y==="全部"?"全部年":y+"年"}</option>`).join("");
  const months = ["全部", ...[...new Set(DATES.filter(d=>bs.year==="全部"||d.slice(0,4)===bs.year).map(d=>d.slice(5,7)))].sort()];
  const monthOpts = months.map(m=>`<option value="${m}" ${m===bs.month?"selected":""}>${m==="全部"?"全部月":(+m)+"月"}</option>`).join("");

  const views = [["board","當日明細"],["analysis","📊 數據分析"],["people","人員成績表"],["wrong","錯題統整"],["rank","常錯題排行"],["daily","逐日總覽"]];
  const jobs = ["全部","拆櫃","拉線","疊櫃"];

  let h = `<div class="bar noprint">
    <div class="seg" id="viewSeg">${views.map(([v,t])=>`<button class="${bs.view===v?"on":""}" data-view="${v}">${t}</button>`).join("")}</div>
    ${bs.view!=="analysis"?`<input type="search" id="q" placeholder="🔍 搜尋姓名或工號" value="${esc(bs.q)}">`:""}
  </div>`;

  if(bs.view==="analysis"){
    h += `<div class="bar noprint">
      <span class="muted" style="font-size:13px;font-weight:600">📅 期間</span>
      <select id="ySel">${yearOpts}</select><select id="mSel">${monthOpts}</select>
      <select id="dFrom">${dopt(bs.from)}</select><span class="muted">–</span><select id="dTo">${dopt(bs.to)}</select>
      <button class="sec" id="dReset">全部</button>
      <button class="sec rf" id="rf"><svg class="rfi" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>重新整理</button>
      ${(bs.from!==DATES[0]||bs.to!==DATES[DATES.length-1])?`<span style="color:var(--accent);font-size:12px;font-weight:700">已篩選 ${bs.from.slice(5)}~${bs.to.slice(5)}</span>`:""}</div>`;
  } else if(bs.view==="board"){
    bs.boardDate = todayStr();
    h += `<div class="bar noprint">
      <span class="muted" style="font-size:13px;font-weight:600">📅 今日 ${bs.boardDate}</span>
      <span class="muted" style="font-size:13px;font-weight:600;margin-left:6px">🚚 中心</span>
      <select id="centerSel">${centerOpts}</select>
      <span class="muted" style="font-size:13px;font-weight:600;margin-left:6px">📦 單位</span>
      <select id="unitSel">${unitOpts}</select>
      <span class="muted" style="font-size:13px;font-weight:600;margin-left:6px">🏢 公司</span>
      <select id="compSel">${compOpts}</select>
      <button class="sec rf" id="rf"><svg class="rfi" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>重新整理</button></div>`;
  } else {
    h += `<div class="bar noprint">
      <div class="seg" id="jobSeg">${jobs.map(j=>`<button class="${bs.job===j?"on":""}" data-job="${j}">${j}</button>`).join("")}</div>
      <span class="muted" style="font-size:13px;font-weight:600">🚚 中心</span>
      <select id="centerSel">${centerOpts}</select>
      <span class="muted" style="font-size:13px;font-weight:600;margin-left:6px">📦 單位</span>
      <select id="unitSel">${unitOpts}</select>
      <span class="muted" style="font-size:13px;font-weight:600;margin-left:6px">🏢 公司</span>
      <select id="compSel">${compOpts}</select>
      <span class="muted" style="font-size:13px;font-weight:600;margin-left:6px">📅 期間</span>
      <select id="ySel">${yearOpts}</select><select id="mSel">${monthOpts}</select>
      <select id="dFrom">${dopt(bs.from)}</select><span class="muted">–</span><select id="dTo">${dopt(bs.to)}</select>
      <button class="sec" id="dReset">全部</button>
      <button class="sec rf" id="rf"><svg class="rfi" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>重新整理</button>
      ${(bs.from!==DATES[0]||bs.to!==DATES[DATES.length-1])?`<span style="color:var(--accent);font-size:12px;font-weight:700">已篩選 ${bs.from.slice(5)}~${bs.to.slice(5)}</span>`:""}</div>`;
  }

  h += `<div id="tiles"></div><div id="body"></div>`;
  view.innerHTML = h;

  renderTiles();
  if(bs.view==="board") renderBoardDay();
  else if(bs.view==="analysis") renderAnalysis();
  else if(bs.view==="people") renderPeople();
  else if(bs.view==="wrong") renderWrong();
  else if(bs.view==="rank") renderRank();
  else renderDaily();

  bindBar();
}

function bindBar(){
  document.querySelectorAll("#viewSeg button").forEach(b=>b.onclick=()=>{ bs.view=b.dataset.view; draw(); });
  const js = document.getElementById("jobSeg"); if(js) js.querySelectorAll("button").forEach(b=>b.onclick=()=>{ bs.job=b.dataset.job; draw(); });
  const rf = document.getElementById("rf"); if(rf) rf.onclick = async ()=>{ rf.classList.add("spin"); RANGE_LOADED=false; await renderBoard(); };
  const cs = document.getElementById("compSel"); if(cs) cs.onchange=()=>{ bs.company=cs.value; draw(); };
  const ce = document.getElementById("centerSel"); if(ce) ce.onchange=()=>{ bs.center=ce.value; draw(); };
  const un = document.getElementById("unitSel"); if(un) un.onchange=()=>{ bs.unit=un.value; draw(); };
  const yS = document.getElementById("ySel"); if(yS) yS.onchange=()=>{ bs.year=yS.value; bs.month="全部";
    const ds=DATES.filter(d=>bs.year==="全部"||d.slice(0,4)===bs.year); bs.from=ds[0]; bs.to=ds[ds.length-1]; draw(); };
  const mS = document.getElementById("mSel"); if(mS) mS.onchange=()=>{ bs.month=mS.value;
    const ds=DATES.filter(d=>(bs.year==="全部"||d.slice(0,4)===bs.year)&&(bs.month==="全部"||d.slice(5,7)===bs.month)); bs.from=ds[0]; bs.to=ds[ds.length-1]; draw(); };
  const dF = document.getElementById("dFrom"); if(dF) dF.onchange=()=>{ bs.from=dF.value; if(bs.to<bs.from) bs.to=bs.from; draw(); };
  const dT = document.getElementById("dTo"); if(dT) dT.onchange=()=>{ bs.to=dT.value; if(bs.from>bs.to) bs.from=bs.to; draw(); };
  const dR = document.getElementById("dReset"); if(dR) dR.onclick=()=>{ bs.year="全部"; bs.month="全部"; bs.from=DATES[0]; bs.to=DATES[DATES.length-1]; draw(); };
  const q = document.getElementById("q");
  if(q){ let composing=false;
    const apply=()=>{ const pos=q.selectionStart; bs.q=q.value; draw(); const nq=document.getElementById("q");
      if(nq){ nq.focus(); try{ nq.setSelectionRange(pos,pos); }catch(_){} } };
    q.addEventListener("compositionstart",()=>composing=true);
    q.addEventListener("compositionend",()=>{ composing=false; apply(); });
    q.oninput=e=>{ if(composing||(e&&e.isComposing)){ bs.q=q.value; return; } apply(); };
  }
  document.querySelectorAll("#body .nameL").forEach(el=>el.onclick=()=>openPerson(el.dataset.person));
  document.querySelectorAll("#body th.sortable").forEach(th=>th.onclick=()=>{
    const k=th.dataset.sort;
    if(bs.sortKey===k) bs.sortDir*=-1; else { bs.sortKey=k; bs.sortDir=(k==="name"||k==="emp_id")?1:-1; }
    draw();
  });
}

// ---- Tiles ----
function renderTiles(){
  const el = document.getElementById("tiles");
  if(bs.view==="analysis"){ el.innerHTML=""; return; }
  if(bs.view==="board"){
    const rows = boardRows();
    const passed = rows.filter(r=>r.passed).length;
    const byC = {}; for(const r of rows){ const c=companyOf(r.emp_id); byC[c]=(byC[c]||{done:0,pass:0}); byC[c].done++; if(r.passed) byC[c].pass++; }
    const comp = Object.entries(byC).map(([k,v])=>`${k} ${v.done}人(過${v.pass})`).join("　")||"—";
    el.innerHTML = `<div class="tiles">
      <div class="tile"><div class="k">完成人數</div><div class="v">${rows.length}</div></div>
      <div class="tile"><div class="k">全對通過</div><div class="v ok">${passed}</div></div>
      <div class="tile"><div class="k">未全對</div><div class="v warn">${rows.length-passed}</div></div>
      <div class="tile" style="grid-column:span 2"><div class="k">各人力公司</div><div style="font-size:13px;margin-top:4px">${esc(comp)}</div></div>
    </div>`;
  } else {
    const rows = flatScoped();
    const wrong = rows.filter(r=>r.is_wrong).length;
    const people = new Set(rows.map(r=>r.name)).size;
    const rate = rows.length ? (rows.length-wrong)/rows.length : 0;
    el.innerHTML = `<div class="tiles">
      <div class="tile"><div class="k">答題人次(題)</div><div class="v">${rows.length}</div></div>
      <div class="tile"><div class="k">受測人數</div><div class="v">${people} <small>人</small></div></div>
      <div class="tile"><div class="k">答對率</div><div class="v ok">${pct(rate)}</div></div>
      <div class="tile"><div class="k">答錯題數</div><div class="v warn">${wrong}</div></div>
    </div>`;
  }
}

// ---- 當日明細（原看板）----
function renderBoardDay(){
  let rows = boardRows();
  if(bs.q){ const q=bs.q.trim(); rows = rows.filter(r=>(r.name||"").includes(q)||(r.emp_id||"").includes(q)); }
  const el = document.getElementById("body");
  if(!rows.length){ el.innerHTML = `<div class="card"><div class="empty">${bs.boardDate} 尚無符合條件的作答。</div></div>`; return; }
  const body = rows.map(r=>{
    const ans = (r.answers||[]).map(a=>`<div class="ans"><span class="${a.ok?'r':'w'}">${a.ok?'✔':'✘'}</span> 【${esc(a.job_type)}】${esc(a.question)}<br>作答：${esc(a.chosen||'（未答）')}${a.ok?'':` → 正解：<b>${esc(a.correct)}</b>`}</div>`).join("");
    return `<tr>
      <td>${esc(r.center||'')}</td><td>${esc(r.unit||'')}</td><td>${esc(companyOf(r.emp_id))}</td><td><code>${esc(r.emp_id)}</code></td>
      <td>${nameLink(r.name)}</td>
      <td>${r.score}/${r.total} <span class="pill ${r.passed?'ok':'warn'}">${r.passed?'通過':'未過'}</span></td>
      <td>${r.duration_sec!=null?r.duration_sec+'s':''}</td>
      <td>${new Date(r.created_at).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})}</td>
      <td><details><summary>明細</summary>${ans}</details></td>
      ${canEdit()?`<td><button class="sec deldr" data-id="${r.id}" title="刪除此紀錄">🗑</button></td>`:""}</tr>`;
  }).join("");
  el.innerHTML = `<div class="card pad0"><h2>${bs.boardDate} 當日明細 <span class="h2note">${rows.length} 人已交卷${canEdit()?"　·　🗑 可刪除填錯者的紀錄，刪後可重新作答":""}</span></h2>
    <div class="tblwrap"><table><thead><tr><th>中心</th><th>單位</th><th>公司</th><th>工號</th><th>姓名</th><th>分數</th><th>用時</th><th>交卷</th><th>答題</th>${canEdit()?"<th></th>":""}</tr></thead>
    <tbody>${body}</tbody></table></div></div>`;
  el.querySelectorAll(".deldr").forEach(b=>b.onclick=()=>delRecord(b.dataset.id, ()=>draw()));
}

// ---- 人員成績表（跨日彙總）----
function personRows(){
  const map = new Map();
  for(const r of flatScoped()){
    let p = map.get(r.name);
    if(!p){ p={ name:r.name, emp_id:r.emp_id, total:0, wrong:0, jobs:new Set(), days:new Set(), badDays:new Set() }; map.set(r.name,p); }
    p.total++; if(r.is_wrong){ p.wrong++; p.badDays.add(r.test_date); } p.jobs.add(r.job_type); p.days.add(r.test_date);
    if(!p.emp_id && r.emp_id) p.emp_id=r.emp_id;
  }
  let arr = [...map.values()].map(p=>({ ...p, right:p.total-p.wrong, jobs:[...p.jobs],
    days:p.days.size, badDays:p.badDays.size, rightRate:p.total?(p.total-p.wrong)/p.total:0, wrongRate:p.total?p.wrong/p.total:0 }));
  if(bs.q){ const q=bs.q.trim(); arr=arr.filter(p=>p.name.includes(q)||(p.emp_id||"").includes(q)); }
  const k=bs.sortKey, d=bs.sortDir;
  arr.sort((a,b)=>{ let x=a[k],y=b[k];
    if(typeof x==="string") return d*x.localeCompare(y,"zh-Hant");
    return d*((x>y?1:x<y?-1:0)) || a.name.localeCompare(b.name,"zh-Hant"); });
  return arr;
}
function sortTh(label,key,cls){ const on=bs.sortKey===key; const arr=on?(bs.sortDir===-1?" ▼":" ▲"):""; return `<th class="sortable ${cls||""}" data-sort="${key}">${label}${arr}</th>`; }
function renderPeople(){
  const arr = personRows();
  let h = `<div class="card pad0"><h2>人員成績資料表 <span class="h2note">${arr.length} 人</span></h2><div class="tblwrap"><table><thead><tr>
    ${sortTh("姓名","name")}${sortTh("工號","emp_id")}<th>工種</th>
    ${sortTh("參加天數","days","num")}${sortTh("答題數","total","num")}${sortTh("答對","right","num")}
    ${sortTh("答錯","wrong","num")}${sortTh("答對率","rightRate","num")}${sortTh("未全對天","badDays","num")}</tr></thead><tbody>`;
  if(!arr.length) h += `<tr><td colspan="9" class="empty">查無資料</td></tr>`;
  for(const p of arr){
    h += `<tr>
      <td>${nameLink(p.name)}</td><td class="muted">${esc(p.emp_id)}</td>
      <td>${p.jobs.map(j=>`<span class="job">${j}</span>`).join("")}</td>
      <td class="num">${p.days}</td><td class="num">${p.total}</td><td class="num">${p.right}</td>
      <td class="num">${p.wrong?`<span class="pill warn">${p.wrong}</span>`:"0"}</td>
      <td class="num"><span class="rate">${pct(p.rightRate)}</span> <span class="mini"><i style="width:${(p.rightRate*100).toFixed(0)}%"></i></span></td>
      <td class="num">${p.badDays?`<span class="pill warn">${p.badDays}</span>`:"—"}</td></tr>`;
  }
  h += `</tbody></table></div></div>`;
  document.getElementById("body").innerHTML = h;
}

// ---- 錯題統整 ----
function wrongData(){
  const map = new Map();
  for(const r of flatScoped()){ if(!r.is_wrong) continue; if(!qOK(r)) continue;
    if(!map.has(r.name)) map.set(r.name,[]); map.get(r.name).push(r); }
  const arr = [...map.entries()].map(([name,items])=>({ name, emp_id:items[0].emp_id,
    items:items.sort((a,b)=>a.test_date.localeCompare(b.test_date)||a.job_type.localeCompare(b.job_type)) }));
  arr.sort((a,b)=>b.items.length-a.items.length||a.name.localeCompare(b.name,"zh-Hant"));
  return arr;
}
function renderWrong(){
  const arr = wrongData();
  let h = `<div class="card pad0"><h2>每個人錯的題目統整 <span class="h2note">${arr.length} 人有答錯</span></h2>`;
  if(!arr.length) h += `<div class="empty">此範圍內沒有答錯的紀錄 🎉</div>`;
  for(const p of arr){
    h += `<div class="wperson"><div class="wname">${nameLink(p.name)}
      <span class="muted" style="font-weight:600;font-size:12px">${esc(p.emp_id)}</span>
      <span class="cnt">答錯 ${p.items.length}</span></div>`;
    for(const r of p.items){
      h += `<div class="wq"><span><span class="job">${r.job_type}</span>${d2(r.test_date)}</span>
        <span><span class="qt">${esc(r.question||"（當日題目）")}</span><br>
        <span class="ans">你的答案：<span class="x">${esc(r.chosen_option)}</span>　正解：<span class="o">${esc(r.correct_option)}</span></span></span></div>`;
    }
    h += `</div>`;
  }
  h += `</div>`;
  document.getElementById("body").innerHTML = h;
}

// ---- 常錯題排行 ----
function rankData(){
  const map = new Map();
  for(const r of flatScoped()){ if(!qOK(r)) continue; if(!r.question) continue;
    const key = r.job_type+"|"+r.question;
    let m = map.get(key);
    if(!m){ m={ job:r.job_type, q:r.question, attempts:0, wrong:0, correct:"", dates:new Set() }; map.set(key,m); }
    m.attempts++; if(r.is_wrong) m.wrong++; m.dates.add(r.test_date);
    if(!m.correct && r.correct_option) m.correct=r.correct_option;
  }
  return [...map.values()].map(m=>({ ...m, pct:m.attempts?m.wrong/m.attempts:0, dates:[...m.dates].sort() }))
    .filter(m=>m.wrong>0).sort((a,b)=>b.wrong-a.wrong||b.pct-a.pct||a.job.localeCompare(b.job));
}
function renderRank(){
  const arr = rankData();
  const tableFor = items => {
    let t = `<div class="tblwrap"><table><thead><tr>
      <th class="num">名次</th><th>題目</th><th class="num">答錯</th><th class="num">答錯率</th><th class="num">應答</th><th>出現日期</th><th>正解</th></tr></thead><tbody>`;
    if(!items.length) t += `<tr><td colspan="7" class="empty">此範圍內無答錯題目 🎉</td></tr>`;
    items.forEach((m,i)=>{ t += `<tr>
      <td class="num"><span class="rnk">${i+1}</span></td>
      <td class="rank-q">${esc(m.q)}</td>

// ---- 逐日總覽 ----
function dailyRate(){
  const map = new Map();
  for(const r of flatScoped()){ let d=map.get(r.test_date); if(!d){ d={ date:r.test_date, n:0, wrong:0, ppl:new Set() }; map.set(r.test_date,d); } d.n++; if(r.is_wrong) d.wrong++; d.ppl.add(r.name); }
  return [...map.values()].sort((a,b)=>a.date.localeCompare(b.date)).map(d=>({ date:d.date, n:d.n, wrong:d.wrong, people:d.ppl.size, rate:d.n?(d.n-d.wrong)/d.n:0 }));
}
function dailyData(){
  const map = new Map();
  for(const r of flatScoped()){ const key=r.test_date+"|"+r.job_type;
    let d=map.get(key); if(!d){ d={ date:r.test_date, job:r.job_type, n:0, wrong:0 }; map.set(key,d); } d.n++; if(r.is_wrong) d.wrong++; }
  return [...map.values()].sort((a,b)=>a.date.localeCompare(b.date)||a.job.localeCompare(b.job));
}
function renderDaily(){
  const rate = dailyRate();
  let h = "";

    const bars = rate.map(r=>{ const hgt=Math.round(r.rate*100);
      const col = r.rate>=0.95?"var(--brand2)":r.rate>=0.8?"var(--accent)":"var(--warn)";
      const mm=+r.date.slice(5,7), dd=+r.date.slice(8,10);
      return `<div class="cbar" title="${r.date}　答對率 ${pct(r.rate)}（${r.n} 題 · ${r.people} 人）">
        <div class="cbar-track"><i style="height:${hgt}%;background:${col}"></i></div>
        <div class="cbar-val">${(r.rate*100).toFixed(0)}</div><div class="cbar-x">${mm}/${dd}</div></div>`;
    }).join("");
    h += `<div class="card pad0"><h2>📈 每日答對率（%）<span class="h2note">${bs.job==="全部"?"全工種合計":bs.job}　綠≥95%、藍≥80%、紅<80%</span></h2><div class="chart">${bars}</div></div>`;
    const maxP=Math.max(1,...rate.map(r=>r.people));
    const pbars = rate.map(r=>{ const hgt=Math.round(r.people/maxP*100); const mm=+r.date.slice(5,7), dd=+r.date.slice(8,10);
      return `<div class="cbar" title="${r.date}　受測 ${r.people} 人（${r.n} 題）">
        <div class="cbar-track"><i style="height:${hgt}%;background:var(--accent)"></i></div>
        <div class="cbar-val">${r.people}</div><div class="cbar-x">${mm}/${dd}</div></div>`;
    }).join("");
    h += `<div class="card pad0"><h2>👥 每日受測人數<span class="h2note">${bs.job==="全部"?"全工種合計":bs.job}（去重人數）</span></h2><div class="chart">${pbars}</div></div>`;
  }
  const arr = dailyData();
  h += `<div class="card pad0"><h2>逐日成效總覽</h2><div class="tblwrap"><table><thead><tr>
    <th>日期</th><th>工種</th><th class="num">答題</th><th class="num">答錯</th><th class="num">答對率</th></tr></thead><tbody>`;
  if(!arr.length) h += `<tr><td colspan="5" class="empty">查無資料</td></tr>`;
  for(const d of arr){ const rt=d.n?(d.n-d.wrong)/d.n:0;
    h += `<tr><td>${esc(d.date)}</td><td><span class="job">${d.job}</span></td>
      <td class="num">${d.n}</td><td class="num">${d.wrong?`<span class="pill warn">${d.wrong}</span>`:"0"}</td>
      <td class="num"><span class="rate">${pct(rt)}</span> <span class="mini"><i style="width:${(rt*100).toFixed(0)}%"></i></span></td></tr>`; }
  h += `</tbody></table></div></div>`;
  document.getElementById("body").innerHTML = h;
}

// ---- 📊 數據分析 ----
const rateColor = x => x>=0.95?"var(--brand2)":x>=0.8?"var(--accent)":"var(--warn)";
// 各面板獨立的 中心/單位/公司 篩選（僅吃期間 + 該面板下拉，不受最上方全域篩選影響）
function scopeFlat(f){ return FLAT.filter(r => dateOK(r)
  && (f.center==="全部"||(r.center||"")===f.center) && (f.unit==="全部"||(r.unit||"")===f.unit) && (f.company==="全部"||companyOf(r.emp_id)===f.company)); }
function scopeResults(f){ return RESULTS.filter(r => dateOK(r)
  && (f.center==="全部"||(r.center||"")===f.center) && (f.unit==="全部"||(r.unit||"")===f.unit) && (f.company==="全部"||companyOf(r.emp_id)===f.company)); }
function jobAgg(rows){
  const order=["拆櫃","拉線","疊櫃"], map=new Map();
  for(const r of rows){ let g=map.get(r.job_type); if(!g){ g={key:r.job_type,n:0,wrong:0,ppl:new Set()}; map.set(r.job_type,g); } g.n++; if(r.is_wrong) g.wrong++; g.ppl.add(r.name); }
  return order.filter(j=>map.has(j)).map(j=>{ const g=map.get(j); return { key:j, n:g.n, wrong:g.wrong, rate:g.n?(g.n-g.wrong)/g.n:0, people:g.ppl.size }; });
}
function optLists(){
  const centers=["全部", ...[...new Set(RESULTS.map(r=>r.center).filter(Boolean))].sort()];
  const UO=["發送單位","到著單位"];
  const units=["全部", ...UO.filter(u=>RESULTS.some(r=>r.unit===u)), ...[...new Set(RESULTS.map(r=>r.unit).filter(u=>u&&!UO.includes(u)))].sort()];
  const comps=["全部", ...COMP_ORDER.filter(c=>RESULTS.some(r=>companyOf(r.emp_id)===c))];
  return { centers, units, comps };
}
function selHTML(id, opts, val, labelAll){
  return `<select id="${id}">`+opts.map(o=>`<option value="${esc(o)}" ${o===val?"selected":""}>${o==="全部"?labelAll:esc(o)}</option>`).join("")+`</select>`;
}
function donutSVG(pass, total){
  const r=52, c=2*Math.PI*r, frac=total?pass/total:0, pl=(c*frac);
  return `<svg class="donut" width="132" height="132" viewBox="0 0 132 132" role="img">
    <circle cx="66" cy="66" r="${r}" fill="none" stroke="var(--warnbg)" stroke-width="16"/>
    <circle cx="66" cy="66" r="${r}" fill="none" stroke="var(--brand2)" stroke-width="16" stroke-linecap="${frac>0&&frac<1?'round':'butt'}"
      stroke-dasharray="${pl.toFixed(1)} ${(c-pl).toFixed(1)}" transform="rotate(-90 66 66)"/>
    <text x="66" y="62" text-anchor="middle" font-size="27" font-weight="800" fill="var(--ink)">${total?Math.round(frac*100):0}%</text>
    <text x="66" y="83" text-anchor="middle" font-size="12" fill="var(--muted)">全對通過</text></svg>`;
}
function groupBarsHTML(items){
  if(!items.length) return `<div class="empty">此範圍尚無資料</div>`;
  return items.map(g=>`<div class="gbar">
    <span class="gk" title="${esc(g.key)}">${esc(g.key)}</span>
    <span class="gt"><i style="width:${(g.rate*100).toFixed(0)}%;background:${rateColor(g.rate)}"></i></span>
    <span class="gv">${pct(g.rate)} <span class="gsub">${g.people}人 / ${g.n}題</span></span></div>`).join("");
}
function filterRowHTML(L, f, prefix){
  return `<div class="asel">
    <span class="muted" style="font-size:12px;font-weight:600">🚚</span>${selHTML(prefix+"Center",L.centers,f.center,"全部中心")}
    <span class="muted" style="font-size:12px;font-weight:600">📦</span>${selHTML(prefix+"Unit",L.units,f.unit,"全部單位")}
    <span class="muted" style="font-size:12px;font-weight:600">🏢</span>${selHTML(prefix+"Company",L.comps,f.company,"全部公司")}</div>`;
}
function renderAnalysis(){
  const L = optLists();
  // 值若已不在清單(資料變動)則退回全部
  const fix=(v,list)=> list.includes(v)?v:"全部";

  const pPeople=new Set(pflat.map(r=>r.name)).size, pAvg=pQn?(pQn-pQw)/pQn:0;

          <div class="dl"><span class="dot" style="background:var(--warnbg)"></span>未全對　<b>${totalR-passed}</b> 人次</div>

          <div class="dl" style="color:var(--muted)">平均題級答對率 <b class="ok">${pct(pAvg)}</b></div>
        </div></div></div>

  document.getElementById("body").innerHTML = h;

  }
  b += `</tbody></table></div></div>`;

  document.querySelectorAll("#mbox .deldr").forEach(bt=>bt.onclick=()=>delRecord(bt.dataset.id, ()=>{

function csvCell(v){ v=(v??"").toString(); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function download(name, rows){
  const csv = "﻿"+rows.map(r=>r.map(csvCell).join(",")).join("\r\n");
  const a = document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download=name; a.click(); URL.revokeObjectURL(a.href);
}

      <button class="sec rf" id="rf"><svg class="rfi" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>重新整理</button>
    </div>
    <div id="gmsg"></div>
    <h3 style="font-size:15px;margin:14px 0 6px">今日延後紀錄${r.extra_min_all?`（全體已 +${r.extra_min_all} 分）`:""}</h3>
    <div class="tblwrap"><table><thead><tr><th>對象</th><th>延後</th><th>核准人</th><th>時間</th></tr></thead><tbody>${exts}</tbody></table></div>`;
  document.getElementById("rf").onclick = (e)=>{ e.currentTarget.classList.add("spin"); loadExt(); };
  document.getElementById("gall").onclick = async ()=>{
    if(!confirm("確定「全體」延後 30 分鐘？")) return;
    const g = await api("grant", { body:{ scope:"all" } });
    msg(g.ok?"✅ 已全體延後 +30 分":"❌ 失敗", g.ok); loadExt();
  };
  document.getElementById("gemp2").onclick = async ()=>{
    const emp = document.getElementById("gemp").value.trim();
    if(!emp){ msg("請輸入工號",false); return; }
    const g = await api("grant", { body:{ scope:"emp", emp_id:emp } });
    msg(g.ok?`✅ 已為工號 ${emp} 延後 +30 分`:("❌ "+(g.reason||"失敗")), g.ok); loadExt();
  };
  function msg(t,ok){ document.getElementById("gmsg").innerHTML = `<div class="msg ${ok?'ok':'warn'}">${esc(t)}</div>`; }

}

async function renderBank(){
  view.innerHTML = `${lockNote()}
  <div class="card">
    <b>➕ 新增題目</b>
    <div class="row" style="margin-top:10px">
      <select id="njob" style="width:120px"><option value="拆櫃">拆櫃</option><option value="拉線">拉線</option><option value="疊櫃">疊櫃</option></select>
      <select id="ntype" style="width:130px"><option value="tf">是非題</option><option value="choice">單選題</option></select>
    </div>
    <input id="nq" placeholder="題目文字" style="width:100%;margin-top:8px">
    <div id="nchoice" style="display:none;margin-top:8px">
      <textarea id="nopts" rows="3" placeholder="每行一個選項，例如：&#10;1.由人工異常排出&#10;2.直接上分貨機即可&#10;3.裝密林籃上分貨機" style="width:100%"></textarea>

    </div>

    <div id="nmsg"></div>
  </div>
  <div class="card">
    <div class="row"><b>🔄 從 Google 表單自動同步</b>
      <button class="act" id="nsync">立即同步新題目</button></div>
    <div class="muted" style="font-size:12px">系統每天自動比對表單資料（training_records），把新表單出現的新題目自動補進題庫（是非題自動補是/否；單選題選項不齊者會先停用，待你補選項）。此鈕為手動立即執行。</div>
    <div id="syncmsg"></div>
  </div>
  <div class="card"><div class="sub">下方為既有題目。拆櫃為單選題（可編輯選項）；拉線／疊櫃為是非題。選項不齊或需停用可在此調整，改完按「儲存」。</div><div id="bk">載入中…</div></div>`;
  wireAddForm();
  document.getElementById("nsync").onclick = async ()=>{
    const m = document.getElementById("syncmsg");
    m.innerHTML = `<div class="msg" style="background:var(--chip)">同步中…</div>`;
    const g = await api("bank_sync", { body:{} });
    if(g.ok){ m.innerHTML = `<div class="msg ok">✅ 同步完成，新增 ${g.added} 題${g.added?"（選項不齊者已停用，請於下方補選項後啟用）":"（沒有新題目）"}</div>`; loadBankList(); }
    else { m.innerHTML = `<div class="msg warn">❌ 同步失敗</div>`; }

function wireAddForm(){
  const job = document.getElementById("njob"), type = document.getElementById("ntype");
  const choiceBox = document.getElementById("nchoice"), tfBox = document.getElementById("ntf");
  function syncType(){ const t = type.value; choiceBox.style.display = t==="choice"?"block":"none"; tfBox.style.display = t==="tf"?"block":"none"; }
  job.onchange = ()=>{ type.value = job.value==="拆櫃"?"choice":"tf"; syncType(); };
  type.onchange = syncType;
  type.value = "choice"; syncType();
  document.getElementById("nadd").onclick = async ()=>{
    const nmsg = document.getElementById("nmsg");
    const body = { job_type: job.value, qtype: type.value, question: document.getElementById("nq").value.trim() };
    if(!body.question){ nmsg.innerHTML = `<div class="msg warn">請輸入題目</div>`; return; }
    if(type.value==="tf"){ body.correct = document.querySelector('input[name=ntfc]:checked').value; }
    else {
      body.options = document.getElementById("nopts").value.split("\n").map(s=>s.trim()).filter(Boolean);
      body.correct = document.getElementById("ncorrect").value.trim();
      if(body.options.length<2){ nmsg.innerHTML = `<div class="msg warn">單選題至少需 2 個選項</div>`; return; }
      if(!body.options.includes(body.correct)){ nmsg.innerHTML = `<div class="msg warn">正解必須與某個選項文字完全相同</div>`; return; }
    }
    const g = await api("bank_add", { body });
    if(g.ok){ nmsg.innerHTML = `<div class="msg ok">✅ 已新增</div>`;
      document.getElementById("nq").value=""; if(document.getElementById("nopts")) document.getElementById("nopts").value=""; if(document.getElementById("ncorrect")) document.getElementById("ncorrect").value="";
      loadBankList();
    } else {
      const m = { duplicate:"此工種已有相同題目", bad_job:"工種錯誤", empty_q:"請輸入題目", need_2_options:"至少需 2 個選項", correct_mismatch:"正解需與某選項相同" }[g.reason] || "新增失敗";
      nmsg.innerHTML = `<div class="msg warn">${esc(m)}</div>`;
    }
  };
}
async function loadBankList(){
  const r = await api("bank_list");
  if(r.error){ document.getElementById("bk").innerHTML = `<div class="msg warn">讀取失敗</div>`; return; }
  const rows = r.rows||[];
  const html = rows.map(q=>{
    const opts = (q.options||[]).join("\n");
    return `<tr data-id="${q.id}">
      <td>${esc(q.job_type)}</td>
      <td style="min-width:220px;white-space:normal">${esc(q.question)}</td>
      <td><textarea class="o" rows="${Math.max(2,(q.options||[]).length)}" style="width:230px;font-size:12px">${esc(opts)}</textarea><div class="muted" style="font-size:11px">每行一個選項</div></td>
      <td><input class="c" value="${esc(q.correct)}" style="width:180px"></td>
      <td><input type="checkbox" class="a" ${q.active?'checked':''}></td>
      <td><button class="act sv">儲存</button></td></tr>`;
  }).join("");
  document.getElementById("bk").innerHTML = `<div class="tblwrap"><table>
    <thead><tr><th>工種</th><th>題目</th><th>選項</th><th>正解(需與某選項完全相同)</th><th>啟用</th><th></th></tr></thead>
    <tbody>${html}</tbody></table></div><div id="bmsg"></div>`;
  document.querySelectorAll("#bk tr[data-id]").forEach(tr=>{
    tr.querySelector(".sv").onclick = async ()=>{
      const id = +tr.dataset.id;
      const options = tr.querySelector(".o").value.split("\n").map(s=>s.trim()).filter(Boolean);
      const correct = tr.querySelector(".c").value.trim();
      const active = tr.querySelector(".a").checked;
      if(active && !options.includes(correct)){ bmsg("⚠️ 正解必須與某個選項完全相同",false); return; }
      if(active && options.length<2){ bmsg("⚠️ 啟用題目至少需 2 個選項",false); return; }
      const g = await api("bank_update", { body:{ id, options, correct, active } });
      bmsg(g.ok?`✅ 已儲存 #${id}`:"❌ 失敗", g.ok);
    };
  });
  function bmsg(t,ok){ document.getElementById("bmsg").innerHTML = `<div class="msg ${ok?'ok':'warn'}">${esc(t)}</div>`; }
  applyLock();
}

async function renderCenter(){
  view.innerHTML = `${lockNote()}<div class="card">
    <div class="row"><input id="cn" placeholder="轉運中心名稱（例：楊梅轉運中心）" style="width:260px">
      <button class="act" id="add">新增／更新</button></div>
    <div id="cmsg"></div>
    <div class="msg" style="background:var(--chip)">登入頁下拉會顯示這裡「啟用」的中心。取消勾選＝停用（不刪除紀錄）。</div>
    <div id="clist">載入中…</div></div>
  <div class="card">
    <b>⏰ 截止時間設定（中心 × 單位）</b>
    <div class="sub" style="margin:4px 0 8px">各中心「發送單位／到著單位」的每日測驗截止時間。<b>當日</b>＝當天該時分；<b>隔日</b>＝跨午夜到隔天該時分（夜班用，例：到著 隔日 01:00）。<br>📅 <b>題目每日 08:00 更新</b>；08:00 前作答計入前一天（夜班整段班別歸同一天）。<br><b>啟用截止</b>取消勾選＝該單位<b>無截止時間限制</b>，員工可隨時作答。</div>
    <div id="dlmsg"></div><div id="dllist">載入中…</div></div>`;
  document.getElementById("add").onclick = async ()=>{
    const name = document.getElementById("cn").value.trim();
    if(!name){ cmsg("請輸入名稱",false); return; }
    const g = await api("center_upsert", { body:{ name, active:true } });
    cmsg(g.ok?"✅ 已儲存":"❌ 失敗", g.ok); loadCenters();
  };
  loadCenters();
  loadDeadlines();
  function cmsg(t,ok){ document.getElementById("cmsg").innerHTML = `<div class="msg ${ok?'ok':'warn'}">${esc(t)}</div>`; }
}
async function loadDeadlines(){
  const [cr, dr] = await Promise.all([api("centers"), api("deadline_list")]);
  const centers = cr.centers||[]; const cfg={};
  (dr.rows||[]).forEach(x=> cfg[x.center+"|"+x.unit]={hhmm:x.hhmm,off:x.day_offset,enabled:x.enabled!==false});
  const units=["發送單位","到著單位"];
  let rows="";
  for(const c of centers) for(const u of units){
    const v=cfg[c+"|"+u]||{hhmm:"19:00",off:0,enabled:true};
    rows+=`<tr data-c="${esc(c)}" data-u="${u}">
      <td>${esc(c)}</td><td>${u}</td>
      <td style="text-align:center"><input type="checkbox" class="den" ${v.enabled?'checked':''}></td>
      <td><input class="dh" value="${esc(v.hhmm)}" style="width:82px" placeholder="HH:MM" ${v.enabled?'':'disabled'}></td>
      <td><select class="do" ${v.enabled?'':'disabled'}><option value="0" ${v.off?'':'selected'}>當日</option><option value="1" ${v.off?'selected':''}>隔日</option></select></td>
      <td><button class="act dsv">儲存</button></td></tr>`;
  }
  if(!rows) rows=`<tr><td colspan="6" class="muted">請先於上方新增並啟用中心。</td></tr>`;
  document.getElementById("dllist").innerHTML=`<div class="tblwrap"><table>
    <thead><tr><th>中心</th><th>單位</th><th>啟用截止</th><th>截止時分(HH:MM)</th><th>當日/隔日</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
  document.querySelectorAll("#dllist tr[data-c]").forEach(tr=>{
    const en=tr.querySelector(".den"), dh=tr.querySelector(".dh"), dosel=tr.querySelector(".do");
    if(en) en.onchange=()=>{ dh.disabled=!en.checked; dosel.disabled=!en.checked; };
    const sv=tr.querySelector(".dsv"); if(!sv) return;
    sv.onclick=async ()=>{
      const enabled=en.checked;
      const hhmm=dh.value.trim(); const off=+dosel.value;
      if(enabled && !/^([01]\d|2[0-3]):[0-5]\d$/.test(hhmm)){ dlmsg("時間格式需 HH:MM（24 小時制，例 19:00）",false); return; }
      const g=await api("deadline_set",{ body:{ center:tr.dataset.c, unit:tr.dataset.u, hhmm:hhmm||"19:00", day_offset:off, enabled } });
      dlmsg(g.ok?(enabled?`✅ 已設定 ${tr.dataset.c}／${tr.dataset.u} → ${off?'隔日':'當日'} ${hhmm}`:`✅ 已設定 ${tr.dataset.c}／${tr.dataset.u} → 無截止時間限制`):("❌ "+({bad_time:"時間格式錯誤",empty:"缺中心/單位"}[g.reason]||"失敗")),g.ok);
    };
  });
  applyLock();
  function dlmsg(t,ok){ document.getElementById("dlmsg").innerHTML=`<div class="msg ${ok?'ok':'warn'}">${esc(t)}</div>`; }
}
async function loadCenters(){
  const r = await api("centers");
  const list = (r.centers||[]);
  document.getElementById("clist").innerHTML = `<div class="tblwrap"><table>
    <thead><tr><th>啟用中的轉運中心</th><th></th></tr></thead><tbody>${
      list.map(c=>`<tr><td>${esc(c)}</td><td><button class="sec dis" data-n="${esc(c)}">停用</button></td></tr>`).join("")||'<tr><td class="muted">無</td></tr>'
    }</tbody></table></div>`;
  document.querySelectorAll("#clist .dis").forEach(b=>{
    b.onclick = async ()=>{ if(!confirm(`停用「${b.dataset.n}」？`))return;
      await api("center_upsert", { body:{ name:b.dataset.n, active:false } }); loadCenters(); };
  });
  applyLock();
}

async function loadPerm(){
  const r=await api("admin_list"); const rows=r.rows||[];
  const body = rows.map(a=>`<tr>
    <td><code>${esc(a.emp_id)}</code></td><td>${esc(a.name||"")}</td>
    <td>${a.active?'<span class="pill ok">啟用</span>':'<span class="pill mut">停用</span>'}</td>
    <td><button class="sec pt" data-e="${esc(a.emp_id)}" data-n="${esc(a.name||'')}" data-a="${a.active?0:1}">${a.active?'停用':'啟用'}</button>
        <button class="sec pd" data-e="${esc(a.emp_id)}" data-n="${esc(a.name||'')}">移除</button></td></tr>`).join("")
    || `<tr><td colspan="4" class="muted">尚無授權對象。你（陳尚福 26516）本來就有最高權限。</td></tr>`;
  document.getElementById("plist").innerHTML=`<div class="tblwrap"><table>
    <thead><tr><th>工號</th><th>姓名</th><th>狀態</th><th></th></tr></thead><tbody>${body}</tbody></table></div>

  document.querySelectorAll("#plist .pt").forEach(b=>b.onclick=async ()=>{
    await api("admin_upsert",{ body:{ emp_id:b.dataset.e, name:b.dataset.n, active:b.dataset.a==="1" } }); loadPerm(); });
  document.querySelectorAll("#plist .pd").forEach(b=>b.onclick=async ()=>{
    if(!confirm(`移除工號 ${b.dataset.e}${b.dataset.n?"（"+b.dataset.n+"）":""} 的權限？`)) return;
    await api("admin_delete",{ body:{ emp_id:b.dataset.e } }); loadPerm(); });
}

async function delRecord(id, after){
  if(!canEdit()){ alert("你沒有刪除權限。"); return; }
  if(!confirm("確定刪除這筆答題紀錄？刪除後該員可重新登入作答（用於更正填錯的單位／工號／姓名）。")) return;
  const r = await api("result_delete", { body:{ id:+id } });
  if(!r.ok){ alert("刪除失敗"+(r.error?"："+r.error:"")); return; }
  RANGE_LOADED=false; await loadRange(); if(after) after();
}
